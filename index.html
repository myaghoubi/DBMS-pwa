.cal-grid button{font:inherit;border:0;background:transparent;color:var(--fg);border-radius:10px;height:40px;cursor:pointer}
.cal-grid button:hover{background:var(--soft)}

#toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1}
body.locked #drawer,body.locked .menu-btn,body.locked #backdrop{display:none!important}
html body.locked #app{margin-right:0!important}
.login{max-width:380px;margin:8vh auto 0;padding:0 16px}.login h1{font-size:22px;margin:0 0 4px}.login .card{margin-top:14px}
.dr-foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.dr-foot .who{display:flex;flex-direction:column;min-width:0}.dr-foot .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filebox .flist{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}.frow{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.fchip{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}.fthumb{width:44px;height:44px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--line)}
.fchip .btn.sm{padding:3px 10px;font-size:13px}
</style>

<script>
'use strict';
/*J-START*/
const J=(()=>{
  const br=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  const div=(a,b)=>Math.trunc(a/b), mod=(a,b)=>a-Math.trunc(a/b)*b;
  function cal(jy,noLeap){
    const bl=br.length; let gy=jy+621, leapJ=-14, jp=br[0], jm, jump=0, leap, leapG, march, n;
    if(jy<jp||jy>=br[bl-1]) throw new Error('Invalid Jalaali year '+jy);
    for(let i=1;i<bl;i++){
      jm=br[i]; jump=jm-jp;
      if(jy<jm) break;
      leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);
      jp=jm;
    }
    n=jy-jp;
    leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);
    if(mod(jump,33)===4&&jump-n===4) leapJ+=1;
    leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
    march=20+leapJ-leapG;
    if(noLeap) return {gy,march};
    if(jump-n<6) n=n-jump+div(jump+4,33)*33;
    leap=mod(mod(n+1,33)-1,4);
    if(leap===-1) leap=4;
    return {leap,gy,march};
  }
  function g2d(gy,gm,gd){
    let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
    d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
    return d;
  }
  function d2g(jdn){
    let j=4*jdn+139361631;
    j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
    const i=div(mod(j,1461),4)*5+308;
    const gd=div(mod(i,153),5)+1, gm=mod(div(i,153),12)+1, gy=div(j,1461)-100100+div(8-gm,6);
    return {gy,gm,gd};
  }
  function j2d(jy,jm,jd){
    const r=cal(jy,true);
    return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;
  }
  function d2j(jdn){
    const gy=d2g(jdn).gy; let jy=gy-621;
    const r=cal(jy,false), jdn1f=g2d(gy,3,r.march); let k=jdn-jdn1f, jm, jd;
    if(k>=0){
      if(k<=185){ return {jy,jm:1+div(k,31),jd:mod(k,31)+1}; }
      k-=186;
    } else {
      jy-=1; k+=179;
      if(r.leap===1) k+=1;
    }
    jm=7+div(k,30); jd=mod(k,30)+1;
    return {jy,jm,jd};
  }
  return {
    toJ:(gy,gm,gd)=>d2j(g2d(gy,gm,gd)),
    toG:(jy,jm,jd)=>d2g(j2d(jy,jm,jd)),
    isLeap:jy=>cal(jy,false).leap===0,
    mlen(jy,jm){return jm<=6?31:jm<=11?30:(cal(jy,false).leap===0?30:29);}
  };
})();
/*J-END*/

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const FA='۰۱۲۳۴۵۶۷۸۹';
const fa=s=>String(s).replace(/\d/g,d=>FA[d]);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WDAYS=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
function add(e,kids){for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(k));}}
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(['value','checked','disabled','selected','readOnly'].includes(k))e[k]=v;
    else e.setAttribute(k,v===true?'':v);
  }
  add(e,kids);return e;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200);}
function openDialog(content,{title='',footer}={}){
  const d=h('dialog',{class:'dlg'});
  d.append(h('div',{class:'dlg-head'},h('h3',{},title),h('button',{type:'button',class:'icon-btn','aria-label':'بستن',onclick:()=>d.close()},'✕')),h('div',{class:'dlg-body'},content));
  if(footer)d.append(h('div',{class:'dlg-foot'},footer(d)));
  d.addEventListener('close',()=>d.remove());
  d.addEventListener('click',e=>{if(e.target===d)d.close();});
  document.body.append(d);d.showModal();return d;
}

/* ---------- storage ---------- */
function load(k,def){try{const v=JSON.parse(localStorage.getItem(k));return v??def;}catch{return def;}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v));}
const Store={
  get forms(){return load('fb.forms',[]);},set forms(v){save('fb.forms',v);},
  get records(){return load('fb.records',{});},set records(v){save('fb.records',v);}
};
const VIRTUAL={};
const getForm=id=>VIRTUAL[id]||Store.forms.find(f=>f.id===id);
const recordsOf=fid=>Store.records[fid]||[];
function setRecords(fid,arr){const r=Store.records;r[fid]=arr;Store.records=r;}
function usesForm(gid,targetId,seen=new Set()){
  if(seen.has(gid))return false;seen.add(gid);
  const g=getForm(gid);if(!g)return false;
  for(const f of g.fields){
    if(f.type!=='subform')continue;
    if(f.subformId===targetId||usesForm(f.subformId,targetId,seen))return true;
  }
  return false;
}

/* ---------- Jalali display ---------- */
const parseJ=s=>{const p=String(s).split('-').map(Number);return p.length===3&&p.every(n=>!isNaN(n))?{jy:p[0],jm:p[1],jd:p[2]}:null;};
const fmtJ=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
function jdLong(s){
  const p=parseJ(s);if(!p)return '';
  try{const g=J.toG(p.jy,p.jm,p.jd);const dow=new Date(g.gy,g.gm-1,g.gd).getDay();
    return fa(`${WDAYS[dow]} ${p.jd} ${MONTHS[p.jm-1]} ${p.jy}`);}catch{return fa(s.replace(/-/g,'/'));}
}
function todayJ(){const t=new Date();return J.toJ(t.getFullYear(),t.getMonth()+1,t.getDate());}

function openJalaliPicker(cur,cb){
  const td=todayJ();const sel=cur?parseJ(cur):null;
  let y=sel?sel.jy:td.jy,m=sel?sel.jm:td.jm;
  const body=h('div',{class:'cal'});
  const dlg=openDialog(body,{title:'انتخاب تاریخ',footer:d=>[
    h('button',{type:'button',class:'btn primary',onclick:()=>{cb(fmtJ(td.jy,td.jm,td.jd));d.close();}},'امروز'),
    h('button',{type:'button',class:'btn danger',onclick:()=>{cb('');d.close();}},'پاک کردن'),
    h('span',{class:'grow'}),
    h('button',{type:'button',class:'btn',onclick:()=>d.close()},'انصراف')]});
  function draw(){
    body.innerHTML='';
    y=Math.min(1500,Math.max(1300,y));
    const years=[];for(let v=1300;v<=1500;v++)years.push(v);
    const nav=h('div',{class:'cal-nav'},
      h('button',{type:'button',class:'icon-btn','aria-label':'ماه قبل',onclick:()=>{m--;if(m<1){m=12;y--;}draw();}},'›'),
      h('select',{onchange:e=>{m=+e.target.value;draw();}},MONTHS.map((n,i)=>h('option',{value:i+1,selected:i+1===m},n))),
      h('select',{onchange:e=>{y=+e.target.value;draw();}},years.map(v=>h('option',{value:v,selected:v===y},fa(v)))),
      h('button',{type:'button',class:'icon-btn','aria-label':'ماه بعد',onclick:()=>{m++;if(m>12){m=1;y++;}draw();}},'‹'));
    const g=J.toG(y,m,1);const off=(new Date(g.gy,g.gm-1,g.gd).getDay()+1)%7;
    const grid=h('div',{class:'cal-grid'},['ش','ی','د','س','چ','پ','ج'].map(w=>h('div',{class:'wd'},w)));
    for(let i=0;i<off;i++)grid.append(h('span'));
    const len=J.mlen(y,m);
    for(let d=1;d<=len;d++){
      const cls=[(off+d-1)%7===6?'fri':'',y===td.jy&&m===td.jm&&d===td.jd?'today':'',sel&&y===sel.jy&&m===sel.jm&&d===sel.jd?'sel':''].join(' ').trim();
      grid.append(h('button',{type:'button',class:cls,onclick:()=>{cb(fmtJ(y,m,d));dlg.close();}},fa(d)));
    }
    body.append(nav,grid);
  }
  draw();
}

/* ---------- field types ---------- */
const TYPES={
  text:{label:'متن کوتاه'},textarea:{label:'متن بلند'},number:{label:'عدد'},
  email:{label:'ایمیل'},tel:{label:'تلفن'},url:{label:'آدرس وب'},
  select:{label:'لیست کشویی',opts:1},radio:{label:'تک‌انتخابی (رادیویی)',opts:1},imageradio:{label:'دکمه‌ای رادیویی با تصویر',choices:1},checkboxes:{label:'چندانتخابی (چک‌باکس)',opts:1},
  boolean:{label:'سوییچ بله/خیر'},
  jdate:{label:'تاریخ شمسی (تقویم فارسی)'},date:{label:'تاریخ میلادی'},time:{label:'ساعت'},
  range:{label:'اسلایدر'},rating:{label:'امتیاز ستاره‌ای'},color:{label:'رنگ'},
  file:{label:'فایل یا تصویر'},
  subform:{label:'زیرفرم (استفاده از فرم دیگر)'}
};
const isEmpty=v=>v==null||v===''||(Array.isArray(v)&&!v.length);

function plain(f,v){
  if(isEmpty(v))return '';
  switch(f.type){
    case 'checkboxes':return v.join('، ');
    case 'file':return (Array.isArray(v)?v:[]).map(x=>x.name).join('، ');
    case 'boolean':return v?'بله':'خیر';
    case 'jdate':return v.replace(/-/g,'/');
    case 'subform':{const sub=getForm(f.subformId);if(!sub)return '';return (f.multiple?v:[v]).map(d=>summarize(sub,d)).join(' | ');}
    default:return String(v);
  }
}
function summarize(form,data){
  const parts=[];
  for(const f of form.fields){
    if(['subform','color','rating','boolean','range'].includes(f.type))continue;
    const t=plain(f,data?.[f.id]);
    if(t)parts.push(['email','url','text','textarea','select','radio','checkboxes'].includes(f.type)?t:fa(t));
    if(parts.length>=3)break;
  }
  return parts.map(p=>'⁨'+p+'⁩').join(' · ');
}
function valueNode(f,v,depth=0){
  if(f.type==='subform'){
    const sub=getForm(f.subformId);
    if(!sub||isEmpty(v))return '—';
    if(depth>5)return '…';
    const arr=f.multiple?v:[v];
    return h('div',{},arr.map(d=>h('div',{class:'ro-sub'},renderReadonly(sub,d,depth+1))));
  }
  if(isEmpty(v))return '—';
  switch(f.type){
    case 'imageradio':{const ch=(f.choices||[]).find(c=>c.label===v);return h('span',{},ch&&ch.img?h('img',{src:ch.img,alt:'',class:'ro-thumb'}):null,' ',String(v));}
    case 'file':return h('div',{},(Array.isArray(v)?v:[]).map(m=>h('div',{},fileNode(m))));
    case 'color':{const s=h('span',{class:'swatch'});s.style.background=String(v);return h('span',{},s,' ',h('span',{dir:'ltr'},v));}
    case 'rating':{const max=f.max||5;return '★'.repeat(v)+'☆'.repeat(Math.max(0,max-v));}
    case 'jdate':return jdLong(v);
    case 'boolean':return v?'بله':'خیر';
    case 'checkboxes':return v.join('، ');
    case 'number':case 'range':case 'time':case 'date':case 'tel':return fa(v);
    default:return String(v);
  }
}
function renderReadonly(form,data,depth=0){
  return h('dl',{class:'ro'},form.fields.flatMap(f=>[h('dt',{},f.label),h('dd',{},valueNode(f,data?.[f.id],depth))]));
}

/* ---------- form UI (runtime) ---------- */
function buildFormUI(form,data,depth=0){
  const cs=form.fields.map(f=>makeField(f,data?.[f.id],depth));
  const el=h('div',{class:'form-fields'},cs.map(c=>c.el));
  return {
    el,
    get(){const o={};form.fields.forEach((f,i)=>{o[f.id]=cs[i].get();});return o;},
    validate(){
      let ok=true,first=null;
      cs.forEach(c=>{if(!c.validate()){ok=false;first=first||c.el;}});
      if(first)first.scrollIntoView({block:'center',behavior:'smooth'});
      return ok;
    }
  };
}

function makeField(f,value,depth){
  const err=h('div',{class:'err'});
  const wrap=h('div',{class:'field'+(f.type==='subform'?' sub':'')});
  wrap.append(h('div',{class:'lbl'},f.label,f.required&&f.type!=='boolean'?h('span',{class:'req'},' *'):null));
  if(f.help)wrap.append(h('div',{class:'help'},f.help));
  const core=buildControl(f,value,depth);
  wrap.append(core.el,err);
  return {
    el:wrap,get:core.get,
    validate(){
      const v=core.get();let msg='';
      if(core.validate)msg=core.validate(v)||'';
      else if(f.required&&!['boolean','range','color'].includes(f.type)&&isEmpty(v))msg='این فیلد الزامی است';
      if(!msg&&!isEmpty(v)){
        if(f.type==='number'){
          if(f.min!=null&&v<f.min)msg=`حداقل مقدار ${fa(f.min)} است`;
          else if(f.max!=null&&v>f.max)msg=`حداکثر مقدار ${fa(f.max)} است`;
        }
        if(f.type==='email'&&!/^\S+@\S+\.\S+$/.test(v))msg='ایمیل معتبر نیست';
        if(f.type==='url'){try{new URL(v);}catch{msg='آدرس معتبر نیست';}}
      }
      err.textContent=msg;wrap.classList.toggle('bad',!!msg);
      return !msg;
    }
  };
}

/* ---- ذخیرهٔ فایل‌ها (IndexedDB؛ در localStorage جا نمی‌شوند) ---- */
const FS=(()=>{
  let dbp=null;
  const open=()=>dbp||(dbp=new Promise((ok,no)=>{const r=indexedDB.open('fbfiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);}));
  const tx=async(mode,fn)=>{const db=await open();return new Promise((ok,no)=>{const t=db.transaction('files',mode),rq=fn(t.objectStore('files'));t.oncomplete=()=>ok(rq&&rq.result);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error);});};
  return {put:r=>tx('readwrite',st=>st.put({...r,at:r.at||Date.now()})),get:id=>tx('readonly',st=>st.get(id)),del:id=>tx('readwrite',st=>st.delete(id)),all:()=>tx('readonly',st=>st.getAll()),clear:()=>tx('readwrite',st=>st.clear())};
})();
const fmtSize=n=>n<1024?fa(n)+' بایت':n<1048576?fa(Math.round(n/1024))+' کیلوبایت':fa((n/1048576).toFixed(1))+' مگابایت';
function shrinkImage(file,max=1600){
  return new Promise(ok=>{
    if(!/^image\/(jpeg|png|webp|bmp)$/.test(file.type))return ok(file);
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      URL.revokeObjectURL(url);
      const k=Math.min(1,max/Math.max(im.width,im.height));
      if(k===1&&file.size<400000)return ok(file);
      const w=Math.max(1,Math.round(im.width*k)),hh=Math.max(1,Math.round(im.height*k));
      const cv=document.createElement('canvas');cv.width=w;cv.height=hh;
      const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,hh);g.drawImage(im,0,0,w,hh);
      cv.toBlob(b=>ok(b&&b.size<file.size?b:file),'image/jpeg',0.85);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);ok(file);};
    im.src=url;
  });
}
function checkFile(f,name,type,size){
  const lim=f.maxMB||10;
  if(f.accept==='image'&&!/^image\//.test(type))throw new Error('در این مورد فقط تصویر پذیرفته می‌شود.');
  if(size>lim*1048576)throw new Error(`حجم «${name}» از ${fa(lim)} مگابایت بیشتر است.`);
}
async function putBlob(f,blob,name,type,shrink){
  let b=blob;
  if(shrink&&f.resize!==false&&/^image\//.test(type)){b=await shrinkImage(blob);if(b!==blob){name=name.replace(/\.[^.]+$/,'')+'.jpg';type='image/jpeg';}}
  const meta={id:uid(),name,type:type||b.type||'application/octet-stream',size:b.size};
  await FS.put({...meta,blob:b});return meta;
}
async function storeFile(f,file){checkFile(f,file.name,file.type,file.size);return putBlob(f,file,file.name||'file',file.type,true);}
async function tgDownload(fileId){
  const c=DB.get('telegram',{}),base=(c.baseUrl||PLATFORMS.telegram.base).replace(/\/+$/,'');
  const info=await tg('getFile',{file_id:fileId});
  const res=await fetch(`${base}/file/bot${c.token}/${info.file_path}`);
  if(!res.ok)throw new Error('HTTP '+res.status);
  return res.blob();
}
function fileNode(m){
  const box=h('span',{class:'fchip'}),label=h('span',{},`${m.name} (${fmtSize(m.size||0)})`);
  box.append(label);
  FS.get(m.id).then(r=>{
    if(r&&r.blob){
      const url=URL.createObjectURL(r.blob);
      if(/^image\//.test(m.type))box.prepend(h('img',{src:url,alt:'',class:'fthumb',onclick:()=>window.open(url,'_blank')}));
      box.append(h('a',{href:url,download:m.name,class:'btn sm'},'دریافت'));
    }else if(m.tg){
      box.append(h('button',{type:'button',class:'btn sm',onclick:async e=>{
        e.target.disabled=true;
        try{const blob=await tgDownload(m.tg.file_id);await FS.put({id:m.id,name:m.name,type:m.type,size:blob.size,blob});box.replaceWith(fileNode(m));}
        catch(er){e.target.disabled=false;toast('دریافت از تلگرام ممکن نشد: '+er.message);}
      }},'دریافت از تلگرام'));
    }
  }).catch(()=>{});
  return box;
}
async function gcFiles(){
  try{
    const all=await FS.all();if(!all.length)return;
    const ref=(localStorage.getItem('fb.records')||'')+(localStorage.getItem('fb.tgsessions')||'');
    for(const r of all)if(Date.now()-(r.at||0)>2*864e5&&!ref.includes(r.id))await FS.del(r.id);
  }catch{}
}
function fileToDataURL(file,max=360){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),hh=Math.max(1,Math.round(im.height*k));
      const cv=document.createElement('canvas');cv.width=w;cv.height=hh;
      const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,hh);g.drawImage(im,0,0,w,hh);
      URL.revokeObjectURL(url);ok(cv.toDataURL('image/jpeg',0.82));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);no(new Error('فایل تصویر معتبر نیست'));};
    im.src=url;
  });
}
const optsOf=f=>f.type==='imageradio'?(f.choices||[]).map(c=>c.label):(f.options||[]);

function buildControl(f,value,depth){
  switch(f.type){
    case 'text':case 'email':case 'tel':case 'url':case 'number':case 'time':case 'date':case 'color':case 'password':{
      const attrs={type:f.type,placeholder:f.placeholder};
      if(f.type==='password'){attrs.autocomplete='new-password';attrs.dir='ltr';}
      if(f.type==='number'){attrs.step='any';attrs.inputmode='decimal';if(f.min!=null)attrs.min=f.min;if(f.max!=null)attrs.max=f.max;}
      attrs.value=value??(f.type==='color'?'#4f46e5':'');
      const inp=h('input',attrs);
      if(f.type==='password')return {el:pwBox(inp),get:()=>inp.value};
      return {el:inp,get:()=>f.type==='number'?(inp.value===''?'':Number(inp.value)):inp.value.trim()};
    }
    case 'textarea':{
      const t=h('textarea',{rows:3,placeholder:f.placeholder,value:value??''});
      return {el:t,get:()=>t.value.trim()};
    }
    case 'select':{
      const s=h('select',{},h('option',{value:''},'انتخاب کنید…'),(f.options||[]).map(o=>h('option',{value:o,selected:o===value},o)));
      return {el:s,get:()=>s.value};
    }
    case 'file':{
      if(f.deferred)return {el:h('div',{class:'note'},f.nested?'در حالت فرم داخل تلگرام، فایلِ داخل زیرفرم‌ها پشتیبانی نمی‌شود.':'فایل را بعد از ثبت فرم، ربات در همین گفتگو از شما می‌گیرد.'),get:()=>[],validate:()=>''};
      let items=Array.isArray(value)?[...value]:[];
      const lim=f.multiple?(f.maxFiles||5):1;
      const list=h('div',{class:'flist'}),msg=h('div',{class:'err'});
      const input=h('input',{type:'file',hidden:true,...(f.multiple?{multiple:true}:{}),...(f.accept==='image'?{accept:'image/*'}:{})});
      const addBtn=h('button',{type:'button',class:'btn',onclick:()=>input.click()});
      const draw=()=>{
        list.innerHTML='';
        items.forEach((m,i)=>list.append(h('div',{class:'frow'},fileNode(m),h('button',{type:'button',class:'icon-btn','aria-label':'حذف',onclick:()=>{items.splice(i,1);draw();}},'✕'))));
        addBtn.textContent=f.accept==='image'?'＋ افزودن تصویر':'＋ افزودن فایل';
        addBtn.style.display=items.length>=lim?'none':'';
      };
      input.addEventListener('change',async()=>{
        const fl=[...input.files];input.value='';msg.textContent='';
        for(const file of fl){
          if(items.length>=lim){msg.textContent=`حداکثر ${fa(lim)} فایل مجاز است.`;break;}
          try{items.push(await storeFile(f,file));}catch(e){msg.textContent=e.message;}
        }
        draw();
      });
      draw();
      return {el:h('div',{class:'filebox'},list,input,addBtn,msg),get:()=>items};
    }
    case 'imageradio':{
      if(f.numbered){
        const name=uid();let cur=value??'';
        const box=h('div',{},(f.choices||[]).map((ch,i)=>h('label',{class:'opt numopt'},h('input',{type:'radio',name,checked:ch.label===value,onchange:()=>{cur=ch.label;}}),h('b',{},fa(i+1)+'.'),ch.label)));
        return {el:box,get:()=>cur};
      }
      const name=uid();let cur=value??'';
      const labels=[];
      const mark=()=>labels.forEach(([l,v])=>l.classList.toggle('sel',v===cur));
      const box=h('div',{class:'imgopts',role:'radiogroup'},(f.choices||[]).map(ch=>{
        const inp=h('input',{type:'radio',name,checked:ch.label===value,onchange:()=>{cur=ch.label;mark();}});
        const l=h('label',{class:'imgopt'},inp,ch.img?h('img',{src:ch.img,alt:ch.label,loading:'lazy'}):h('span',{class:'imgopt-ph'}),h('span',{class:'imgopt-t'},ch.label));
        labels.push([l,ch.label]);return l;
      }));
      mark();
      return {el:box,get:()=>cur};
    }
    case 'radio':{
      const name=uid();let cur=value??'';
      const box=h('div',{},(f.options||[]).map(o=>h('label',{class:'opt'},h('input',{type:'radio',name,checked:o===value,onchange:()=>{cur=o;}}),o)));
      return {el:box,get:()=>cur};
    }
    case 'checkboxes':{
      const sel=new Set(Array.isArray(value)?value:[]);
      const box=h('div',{},(f.options||[]).map(o=>h('label',{class:'opt'},h('input',{type:'checkbox',checked:sel.has(o),onchange:e=>{e.target.checked?sel.add(o):sel.delete(o);}}),o)));
      return {el:box,get:()=>(f.options||[]).filter(o=>sel.has(o))};
    }
    case 'boolean':{
      const inp=h('input',{type:'checkbox',checked:!!value});
      const txt=h('span',{},inp.checked?'بله':'خیر');
      inp.addEventListener('change',()=>{txt.textContent=inp.checked?'بله':'خیر';});
      return {el:h('label',{class:'switch'},inp,h('span',{class:'slider'}),txt),get:()=>inp.checked};
    }
    case 'range':{
      const min=f.min??0,max=f.max??100,step=f.step||1;
      const out=h('output',{});
      const inp=h('input',{type:'range',min,max,step,value:value===''||value==null?min:value,oninput:()=>{out.textContent=fa(inp.value);}});
      out.textContent=fa(inp.value);
      return {el:h('div',{class:'rangebox'},inp,out),get:()=>Number(inp.value)};
    }
    case 'rating':{
      const max=f.max||5;let cur=+value||0;
      const wrap=h('div',{class:'stars'});
      const draw=()=>{wrap.innerHTML='';for(let i=1;i<=max;i++)wrap.append(h('button',{type:'button',class:'star'+(i<=cur?' on':''),'aria-label':fa(i),onclick:()=>{cur=cur===i?0:i;draw();}},'★'));};
      draw();
      return {el:wrap,get:()=>cur||''};
    }
    case 'jdate':{
      let cur=value||'';
      const inp=h('input',{type:'text',readOnly:true,placeholder:'انتخاب تاریخ شمسی…',onclick:open});
      const clr=h('button',{type:'button',class:'icon-btn','aria-label':'پاک کردن',onclick:()=>{cur='';show();}},'✕');
      const show=()=>{inp.value=cur?jdLong(cur):'';clr.style.visibility=cur?'visible':'hidden';};
      function open(){openJalaliPicker(cur,v=>{cur=v;show();});}
      show();
      return {el:h('div',{class:'jd-wrap'},inp,clr),get:()=>cur};
    }
    case 'subform':return buildSubform(f,value,depth);
  }
  return {el:h('div',{},'نوع فیلد ناشناخته'),get:()=>null};
}

function buildSubform(f,value,depth){
  const sub=getForm(f.subformId);
  const multi=!!f.multiple;

function decorate(){
  document.querySelectorAll('.btn:not([data-ic]),.fab:not([data-ic]),.icon-btn:not([data-ic]),.star:not([data-ic])').forEach(el=>{
    el.dataset.ic='1';

    if(el.classList.contains('star')){el.textContent='';el.append(ic('star'));return;}
    if(ICON_ONLY.has(t)){el.textContent='';el.append(ic(ICON_OF[t]));return;}
    if(/^＋/.test(t))name='plus';else name=LABEL_ICONS[t];
    if(!name)return;
    const tn=[...el.childNodes].find(n=>n.nodeType===3&&n.nodeValue.trim());
    if(tn)tn.nodeValue=tn.nodeValue.replace(/^\s*＋\s*/,'');
    el.prepend(ic(name));

}

const enc8=s=>new TextEncoder().encode(s);

function sha256hex(str){ // نسخهٔ سادهٔ جاوااسکریپت برای مرورگرهایی که crypto.subtle ندارند (آدرس http غیر امن)
  const K=[];for(let i=0,c=2;K.length<64;c++){let pr=true;for(let j=2;j*j<=c;j++)if(c%j===0){pr=false;break;}if(pr){K.push((Math.pow(c,1/3)%1*4294967296)|0);i++;}}
  let H=[];for(let i=0,c=2;H.length<8;c++){let pr=true;for(let j=2;j*j<=c;j++)if(c%j===0){pr=false;break;}if(pr)H.push((Math.pow(c,1/2)%1*4294967296)|0);}
  const b=enc8(str),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=0x80;
  const dv=new DataView(m.buffer);dv.setUint32(n-4,l*8>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
  const w=new Int32Array(64),r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getInt32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(c,17)^r(c,19)^(c>>>10)))|0;}
    let [a,bb,c,d,e,f,g,hh]=H;
    for(let i=0;i<64;i++){
      const t1=(hh+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;
    }
    H=[H[0]+a|0,H[1]+bb|0,H[2]+c|0,H[3]+d|0,H[4]+e|0,H[5]+f|0,H[6]+g|0,H[7]+hh|0];
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
async function deriveHash(pw,salt,kdf){
  if(kdf==='pbkdf2'){
    if(!(window.crypto&&crypto.subtle))throw new Error('این گذرواژه با روش امن مرورگر ساخته شده و روی این آدرس (غیر https) قابل بررسی نیست.');
    const k=await crypto.subtle.importKey('raw',enc8(pw),'PBKDF2',false,['deriveBits']);
    return toB64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),hash:'SHA-256',iterations:150000},k,256)));
  }
  let x=sha256hex(salt+pw);for(let i=0;i<20000;i++)x=sha256hex(x+salt+pw);return x;
}
async function makeCred(pw){
  const salt=toB64(crypto.getRandomValues(new Uint8Array(16)));

}

function viewLogin(){
  document.body.classList.add('locked');
  const err=h('div',{class:'err'});
  const un=h('input',{type:'text',autocomplete:'username',dir:'ltr',autofocus:true}),pw=h('input',{type:'password',autocomplete:'current-password',dir:'ltr'});
  const rem=h('input',{type:'checkbox'});
  const btn=h('button',{type:'button',class:'btn primary',onclick:go},'ورود');
  async function go(){
    const fs=failState();
    if(fs.until>Date.now()){err.textContent=`تلاش‌های ناموفق زیاد بود؛ ${fa(Math.ceil((fs.until-Date.now())/1000))} ثانیه صبر کنید.`;return;}
    btn.disabled=true;err.textContent='';
    try{
      const u=DB.get('users',[]).find(x=>x.username===un.value.trim());
      let ok=false;
      if(u&&u.active!==false&&u.hash)ok=(await deriveHash(pw.value,u.salt,u.kdf))===u.hash;
      else await deriveHash(pw.value,'x','js'); // زمان پاسخ برای کاربر ناموجود هم مشابه بماند
      if(!ok){
        const n=fs.n+1;localStorage.setItem('fb.authfail',JSON.stringify({n,until:n>=5?Date.now()+30000*(n-4):0}));
        err.textContent='نام کاربری یا گذرواژه درست نیست.';
      }else{
        localStorage.removeItem('fb.authfail');setSession(u.id,rem.checked);
        document.body.classList.remove('locked');buildDrawer();
        if(!location.hash||location.hash.startsWith('#/login'))location.hash='#/';route();
      }
    }catch(e){err.textContent=e.message;}
    btn.disabled=false;
  }
  [un,pw].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go();}));
  const app=$('#app');app.innerHTML='';
  app.append(h('div',{class:'login'},h('h1',{},appName()),h('p',{class:'muted'},'برای ادامه وارد شوید.'),

      h('div',{class:'btn-row'},btn))));
  setTimeout(()=>un.focus(),50);
}

/* ---- reports & charts ---- */
const COLORS=['#4f46e5','#16a34a','#f59e0b','#dc2626','#0891b2','#9333ea','#db2777','#65a30d','#ea580c','#475569'];
function aggregate(f,recs){
  const vals=recs.map(r=>r.data[f.id]);
  const m=new Map();const inc=k=>m.set(k,(m.get(k)||0)+1);const t=f.type;
  if(t==='checkboxes')vals.forEach(v=>(v||[]).forEach(inc));
  else if(t==='boolean')vals.forEach(v=>inc(v?'بله':'خیر'));
  else if(t==='jdate')vals.forEach(v=>{if(v)inc(String(v).slice(0,7).replace('-','/'));});
  else if(t==='number'||t==='range'){
    const nums=vals.filter(v=>typeof v==='number');
    if(!nums.length)return [];
    const mn=Math.min(...nums),mx=Math.max(...nums),distinct=new Set(nums).size;
    if(distinct<=8)nums.forEach(v=>inc(v));
    else{
      const w=(mx-mn)/6||1;const bins=Array.from({length:6},(_,i)=>({label:`${+(mn+i*w).toFixed(1)} تا ${+(mn+(i+1)*w).toFixed(1)}`,count:0}));
      nums.forEach(v=>{bins[Math.min(5,Math.floor((v-mn)/w))].count++;});return bins;
    }
  }else vals.forEach(v=>{if(!isEmpty(v))inc(String(v));});
  let rows=[...m].map(([label,count])=>({label:String(label),count}));
  if(t==='jdate'||t==='rating'||t==='number'||t==='range')rows.sort((a,b)=>a.label.localeCompare(b.label,undefined,{numeric:true}));
  else rows.sort((a,b)=>b.count-a.count);
  return rows;
}
function barChart(rows){
  const mx=Math.max(1,...rows.map(r=>r.count));
  return h('div',{class:'bars'},rows.map((r,i)=>h('div',{class:'bar-row'},
    h('span',{class:'bar-l'},fa(r.label)),
    h('div',{class:'bar-track'},(()=>{const b=h('div',{class:'bar-fill'});b.style.width=(r.count/mx*100)+'%';b.style.background=COLORS[i%COLORS.length];return b;})()),
    h('b',{class:'bar-n'},fa(r.count)))));
}
function pieChart(rows){
  const total=rows.reduce((s,r)=>s+r.count,0)||1;let a=-Math.PI/2;const cx=100,cy=100,R=90;let paths='';
  rows.forEach((r,i)=>{
    const ang=r.count/total*Math.PI*2,col=COLORS[i%COLORS.length];
    if(rows.length===1){paths+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${col}"/>`;return;}
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a+ang),y2=cy+R*Math.sin(a+ang);
    paths+=`<path d="M${cx} ${cy}L${x1.toFixed(2)} ${y1.toFixed(2)}A${R} ${R} 0 ${ang>Math.PI?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z" fill="${col}"/>`;a+=ang;
  });
  const svg=h('div',{class:'pie'});svg.innerHTML=`<svg viewBox="0 0 200 200" role="img" aria-label="نمودار دایره‌ای">${paths}<circle cx="100" cy="100" r="46" fill="var(--card)"/></svg>`;
  const legend=h('div',{class:'legend'},rows.map((r,i)=>{const s=h('span',{class:'swatch'});s.style.background=COLORS[i%COLORS.length];return h('div',{},s,' ',fa(r.label),' — ',h('b',{},fa(r.count)),h('span',{class:'muted sm'},` (${fa(Math.round(r.count/total*100))}٪)`));}));
  return h('div',{class:'pie-wrap'},svg,legend);
}
function tableChart(rows){return h('table',{class:'tbl'},h('tbody',{},rows.map(r=>h('tr',{},h('td',{},fa(r.label)),h('td',{},fa(r.count))))));}
function reportBody(rep){
  const f=getForm(rep.formId);const fld=f&&f.fields.find(x=>x.id===rep.fieldId);
  if(!f||!fld)return h('div',{class:'note'},'فرم یا فیلد این گزارش دیگر وجود ندارد.');
  const recs=recordsOf(f.id);const rows=aggregate(fld,recs);
  if(!rows.length)return h('div',{class:'empty sm'},'داده‌ای برای نمایش نیست.');
  const out=h('div',{},h('div',{class:'muted sm'},`${f.title} ← ${fld.label} · ${fa(recs.length)} رکورد`),
    rep.chart==='pie'?pieChart(rows):rep.chart==='table'?tableChart(rows):barChart(rows));
  if(['number','range'].includes(fld.type)){
    const nums=recs.map(r=>r.data[fld.id]).filter(v=>typeof v==='number');
    if(nums.length){const s=nums.reduce((a,b)=>a+b,0);out.append(h('div',{class:'stats'},
      [['جمع',s],['میانگین',+(s/nums.length).toFixed(2)],['کمترین',Math.min(...nums)],['بیشترین',Math.max(...nums)]].map(([l,v])=>h('span',{class:'badge'},`${l}: ${fa(v)}`))));}
  }
  return out;
}
function openReportEditor(rep){

  const r=rep?{...rep}:{id:uid(),title:'',formId:forms[0].id,fieldId:'',chart:'bar'};

  const t=h('input',{type:'text',value:r.title,placeholder:'مثلاً: توزیع وضعیت مشتریان'});

  const ct=h('select',{onchange:()=>{r.chart=ct.value;}},[['bar','نمودار میله‌ای'],['pie','نمودار دایره‌ای'],['table','جدول']].map(([v,l])=>h('option',{value:v,selected:v===r.chart},l)));
  fill();
  const row=(l,c)=>h('label',{class:'row'},h('span',{},l),c);
  openDialog(h('div',{},row('عنوان گزارش',t),row('فرم',fs),row('فیلد مورد تحلیل',fl),row('نوع نمایش',ct)),{title:rep?'ویرایش گزارش':'گزارش جدید',footer:d=>[
    h('button',{class:'btn primary',onclick:()=>{
      if(!r.fieldId){toast('این فرم فیلد قابل گزارش ندارد');return;}
      r.title=t.value.trim()||`${getForm(r.formId).title} — ${fl.selectedOptions[0].textContent}`;upsert('reports',r);d.close();viewReports();}},'ذخیره'),
    h('button',{class:'btn',onclick:()=>d.close()},'انصراف')]});

function enableAuth(){
  const roles=DB.get('roles',[]);
  const schema={id:'__adm',title:'مدیر',fields:[
    F('name','نام مدیر','text',{required:true}),F('username','نام کاربری','text',{required:true}),

  editEntity(schema,{},'ساخت مدیر و فعال‌سازی ورود',d=>{
    if(d.password.length<6){toast('گذرواژه حداقل ۶ نویسه باشد');return false;}
    (async()=>{
      let rs=DB.get('roles',[]);
      let role=rs.find(r=>(r.perms||[]).includes('users'));
      if(!role){role={id:uid(),name:'مدیر کل',perms:PERMS.map(p=>p[0])};rs.push(role);DB.set('roles',rs);}

      const user={...(ex||{id:uid(),phone:''}),name:d.name,username:d.username,roles:[...new Set([...((ex&&ex.roles)||[]),role.name])],active:true,...cred};
      upsert('users',user);

  telegram:{name:'تلگرام',base:'https://api.telegram.org',how:'در تلگرام با «@BotFather» ربات بسازید و توکن را وارد کنید. اگر دسترسی مستقیم به تلگرام محدود است، آدرس API را با یک واسط/پروکسی جایگزین کنید.'}};
async function botCall(p,method,body,signal){
  const c=DB.get(p,{});if(!c.token)throw new Error('توکن ربات وارد نشده است');
  const base=(c.baseUrl||PLATFORMS[p].base).replace(/\/+$/,'');
  const res=await fetch(`${base}/bot${c.token}/${method}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{}),signal});
  const j=await res.json().catch(()=>({}));
  if(!res.ok||j.ok===false)throw new Error(j.description||('خطای HTTP '+res.status));
  return j.result;
}
function sendMsg(p,text,chatId){
  const id=chatId||DB.get(p,{}).chatId;if(!id)return Promise.reject(new Error('شناسهٔ چت وارد نشده است'));
  return botCall(p,'sendMessage',{chat_id:id,text});
}
async function broadcast(text){
  const out=[];
  for(const p of Object.keys(PLATFORMS)){
    const c=DB.get(p,{});if(!c.enabled||!c.token)continue;
    try{await sendMsg(p,text);out.push(`${PLATFORMS[p].name}: ارسال شد`);}catch(e){out.push(`${PLATFORMS[p].name}: ${e.message}`);}
  }
  return out;
}

}

/* ---- backup & restore ---- */
const BACKUP_KEYS=['forms','records','tgsubs','users','roles','processes','reports','settings','messenger','bale','telegram'];
const blobToB64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>no(r.error);r.readAsDataURL(b);});
async function exportBackup(withSecrets,withFiles){
  const data={};
  BACKUP_KEYS.forEach(k=>{let v=DB.get(k,null);if(v==null)return;if(!withSecrets&&(k==='bale'||k==='telegram'))v={...v,token:''};data[k]=v;});
  const out={app:'formbuilder',version:APP_VERSION,date:Date.now(),data};
  if(withFiles){
    try{out.files=[];for(const r of await FS.all())out.files.push({id:r.id,name:r.name,type:r.type,size:r.size,b64:await blobToB64(r.blob)});}
    catch(e){toast('خواندن فایل‌ها ممکن نشد؛ پشتیبان بدون فایل ساخته شد');delete out.files;}
  }
  const t=todayJ(),stamp=fmtJ(t.jy,t.jm,t.jd);
  download(`formbuilder-backup-${stamp}.json`,JSON.stringify(out,null,1),'application/json');
  DB.set('meta',{...DB.get('meta',{}),lastBackup:stamp.replace(/-/g,'/')});
}
function importBackup(e){
  const file=e.target.files[0];e.target.value='';if(!file)return;
  file.text().then(t=>{
    const d=JSON.parse(t);
    const data=d.data||(Array.isArray(d.forms)?{forms:d.forms,records:d.records||{}}:null);
    if(!data||!Array.isArray(data.forms))throw 0;
    if(!confirm('اطلاعات فعلی با پشتیبان جایگزین شود؟'))return;
    BACKUP_KEYS.forEach(k=>{
      if(!(k in data))return;
      let v=data[k];
      if((k==='bale'||k==='telegram')&&v&&!v.token)v={...v,token:DB.get(k,{}).token||''};
      DB.set(k,v);
    });
    (async()=>{for(const x of d.files||[]){try{await FS.put({id:x.id,name:x.name,type:x.type,size:x.size,blob:await (await fetch(`data:${x.type||'application/octet-stream'};base64,${x.b64}`)).blob()});}catch{}}})();
    toast('بازیابی شد');applySettings();route();
  }).catch(()=>toast('فایل پشتیبان معتبر نیست'));
}
function viewBackup(){
  const secrets=h('input',{type:'checkbox'}),withFiles=h('input',{type:'checkbox',checked:true});
  const file=h('input',{type:'file',accept:'application/json,.json',hidden:true,onchange:importBackup});
  const last=DB.get('meta',{}).lastBackup;
  const forms=Store.forms,recs=Store.records;
  const total=forms.reduce((n,f)=>n+(recs[f.id]||[]).length,0);
  page({title:'پشتیبان‌گیری و بازیابی'},
    h('div',{class:'card'},h('h2',{},'وضعیت داده‌ها'),
      h('p',{class:'muted'},`${fa(forms.length)} فرم · ${fa(total)} رکورد · ${fa(DB.get('users',[]).length)} کاربر · ${fa(DB.get('processes',[]).length)} فرآیند · ${fa(DB.get('reports',[]).length)} گزارش`),
      h('p',{class:'muted sm'},last?'آخرین پشتیبان‌گیری: '+fa(last):'هنوز پشتیبان‌گیری نشده است.')),
    h('div',{class:'card'},h('h2',{},'پشتیبان‌گیری'),
      h('label',{class:'chk'},secrets,'توکن ربات‌ها هم در فایل باشد'),
      h('label',{class:'chk'},withFiles,'فایل‌ها و تصاویر ضمیمهٔ رکوردها هم در پشتیبان باشد (حجم فایل زیاد می‌شود)'),
      h('div',{class:'btn-row'},h('button',{class:'btn primary',onclick:async()=>{await exportBackup(secrets.checked,withFiles.checked);viewBackup();}},'دریافت فایل پشتیبان'))),
    h('div',{class:'card'},h('h2',{},'بازیابی'),h('p',{class:'muted sm'},'اطلاعات فعلی با محتوای فایل جایگزین می‌شود.'),
      h('div',{class:'btn-row'},h('button',{class:'btn',onclick:()=>file.click()},'انتخاب فایل پشتیبان'),file)),
    h('div',{class:'card'},h('h2',{style:'color:var(--danger)'},'پاک‌سازی'),
      h('div',{class:'btn-row'},h('button',{class:'btn danger',onclick:()=>{
        if(confirm('همهٔ داده‌های برنامه پاک شود؟ این کار قابل بازگشت نیست.')&&confirm('مطمئن هستید؟')){FS.clear().catch(()=>{});BACKUP_KEYS.concat('meta').forEach(k=>localStorage.removeItem('fb.'+k));applySettings();location.hash='#/';route();toast('پاک شد');}}},'پاک کردن همهٔ داده‌ها'))));
}

/* ---- update & versioning ---- */
let swReg=null;
const INTERVALS={'خاموش':0,'هر ۱۵ دقیقه':15,'هر ساعت':60,'روزانه':1440};
const intervalMin=()=>{const l=DB.get('settings',{}).updateInterval||'هر ساعت';return INTERVALS[l]??60;};
const cmpVer=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d<0?-1:1;}return 0;};
const UPD={info:null,changelog:[],available:false,checking:false};
const setMeta=o=>DB.set('meta',{...DB.get('meta',{}),...o});

async function fetchRemoteVersion(){
  const r=await fetch(`version.js?t=${Date.now()}`,{cache:'no-store'});
  if(!r.ok)throw new Error('خطای HTTP '+r.status);
  const txt=await r.text();
  const v=txt.match(/APP_VERSION\s*=\s*'(\d+\.\d+\.\d+)'/);
  if(!v)throw new Error('فایل نسخه نامعتبر است');
  return {version:v[1],date:(txt.match(/APP_DATE\s*=\s*'([^']*)'/)||[])[1]||''};
}
async function fetchChangelog(){
  for(const u of [`changelog.json?t=${Date.now()}`,'changelog.json']){
    try{const r=await fetch(u,{cache:'no-store'});if(r.ok){const j=await r.json();if(Array.isArray(j))return j;}}catch{}
  }
  return [];
}
async function checkForUpdate({silent=false}={}){
  if(UPD.checking)return UPD.info;
  UPD.checking=true;
  try{
    const j=await fetchRemoteVersion();
    UPD.info=j;UPD.available=cmpVer(j.version,APP_VERSION)>0;
    UPD.changelog=await fetchChangelog();
    setMeta({lastCheck:Date.now()});
    markUpdateBadge();
    if(UPD.available&&DB.get('meta',{}).dismissed!==j.version)showUpdateBanner(j);
    if(!UPD.available)$('#upd-banner')?.remove();
    return j;
  }catch(e){if(!silent)throw e;return null;}
  finally{UPD.checking=false;}
}
function markUpdateBadge(){
  drawerEl&&drawerEl.querySelector('.dr-item[data-id=update]')?.classList.toggle('has-update',UPD.available);
  document.querySelector('.menu-btn')?.classList.toggle('has-update',UPD.available);
}
function showUpdateBanner(j){
  let b=$('#upd-banner');if(b)b.remove();
  b=h('div',{id:'upd-banner',role:'status'},
    h('span',{},`نسخهٔ ${fa(j.version)} آماده است`),
    h('button',{class:'btn primary',onclick:()=>openUpdateDialog(j)},'مشاهده'),
    h('button',{class:'icon-btn','aria-label':'بعداً',onclick:()=>{setMeta({dismissed:j.version});b.remove();}},'✕'));
  document.body.append(b);
}
function notesSince(){return (UPD.changelog||[]).filter(e=>cmpVer(e.version,APP_VERSION)>0);}
function changelogNode(entries){
  return h('div',{},entries.map(e=>h('div',{class:'cl'},h('b',{},'نسخهٔ '+fa(e.version)),' ',h('span',{class:'muted sm'},fa(e.date||'')),
    h('ul',{class:'steps'},(e.notes||[]).map(n=>h('li',{},n))))));
}
function openUpdateDialog(j){
  const entries=notesSince();
  openDialog(h('div',{},
    h('p',{},`نسخهٔ فعلی ${fa(APP_VERSION)} ← نسخهٔ جدید ${fa(j.version)}`),
    entries.length?changelogNode(entries):null,
    h('div',{class:'note sm'},'با بروزرسانی، برنامه یک‌بار بارگذاری مجدد می‌شود؛ اطلاعات ذخیره‌شده حفظ می‌شود اما فرمی که نیمه‌کاره پر کرده‌اید ذخیره نمی‌شود.')),
  {title:'نسخهٔ جدید برنامه',footer:d=>[
    h('button',{class:'btn primary',onclick:()=>{d.close();applyUpdate();}},'بروزرسانی اکنون'),
    h('button',{class:'btn',onclick:()=>{setMeta({dismissed:j.version});$('#upd-banner')?.remove();d.close();}},'بعداً')]});
}
function waitForWaiting(reg,ms){
  return new Promise(res=>{
    if(reg.waiting)return res(reg.waiting);
    const t=setTimeout(()=>res(null),ms);
    const watch=w=>{if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'){clearTimeout(t);res(reg.waiting||w);}});};
    watch(reg.installing);
    reg.addEventListener('updatefound',()=>watch(reg.installing));
  });
}
async function applyUpdate(){
  toast('در حال بروزرسانی…');
  try{
    if('serviceWorker' in navigator){
      const reg=swReg||await navigator.serviceWorker.getRegistration();
      if(reg){
        await reg.update();
        const w=await waitForWaiting(reg,15000);
        if(w){w.postMessage({type:'SKIP_WAITING'});return;}  // controllerchange صفحه را بارگذاری مجدد می‌کند
      }
    }
  }catch{}
  try{if('caches' in window)for(const k of await caches.keys())await caches.delete(k);}catch{}
  location.reload();
}
let updTimer=null;
function scheduleUpdateChecks(){
  clearInterval(updTimer);
  const min=intervalMin();if(!min)return;
  updTimer=setInterval(()=>{if(navigator.onLine)checkForUpdate({silent:true});},min*60000);
}
function checkIfDue(){
  const min=intervalMin();if(!min||!navigator.onLine)return;
  if(Date.now()-(DB.get('meta',{}).lastCheck||0)>=min*60000)checkForUpdate({silent:true});
}
document.addEventListener('visibilitychange',()=>{if(!IS_MINI&&document.visibilityState==='visible')checkIfDue();});

function viewUpdate(){
  const status=h('div',{class:'note'},'');
  const last=h('p',{class:'muted sm'});
  const apply=h('button',{class:'btn primary',hidden:true,onclick:()=>UPD.info&&openUpdateDialog(UPD.info)},'مشاهده و بروزرسانی');
  const log=h('div',{});
  const inst=h('button',{class:'btn',hidden:!deferredPrompt,onclick:async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;inst.hidden=true;}},'نصب برنامه روی دستگاه');
  window.__showInstall=()=>{inst.hidden=false;};
  function paint(){
    const lc=DB.get('meta',{}).lastCheck;
    last.textContent=lc?'آخرین بررسی: '+fmtDT(lc):'هنوز بررسی نشده است.';
    if(UPD.info){
      status.textContent=UPD.available?`نسخهٔ جدید ${fa(UPD.info.version)} در دسترس است.`:'شما از آخرین نسخه استفاده می‌کنید ✓';
      apply.hidden=!UPD.available;
      log.innerHTML='';log.append(changelogNode((UPD.changelog||[]).slice(0,10)));
    }else status.textContent='برای بررسی نسخهٔ جدید، دکمهٔ زیر را بزنید.';
  }
  const check=async()=>{
    status.textContent='در حال بررسی…';
    try{await checkForUpdate();}catch(e){status.textContent='بررسی ناموفق بود: '+e.message+' (اتصال اینترنت را بررسی کنید)';return;}
    paint();
  };
  paint();
  page({title:'بروزرسانی'},
    h('div',{class:'card'},h('h2',{},'نسخهٔ فعلی'),h('p',{style:'font-size:22px;font-weight:700'},fa(APP_VERSION)),
      h('p',{class:'muted sm'},'بررسی خودکار: '+(DB.get('settings',{}).updateInterval||'هر ساعت')+' (قابل تغییر در تنظیمات برنامه)')),
    h('div',{class:'card'},status,last,h('div',{class:'btn-row'},h('button',{class:'btn primary',onclick:check},'بررسی بروزرسانی'),apply,inst)),
    h('div',{class:'card'},h('h2',{},'تاریخچهٔ تغییرات'),log),
    h('div',{class:'card'},h('h2',{},'رفع مشکل'),h('p',{class:'muted sm'},'پاک کردن حافظهٔ پنهان برنامه (داده‌های شما پاک نمی‌شود) و بارگذاری مجدد.'),
      h('div',{class:'btn-row'},h('button',{class:'btn',onclick:async()=>{if('caches' in window)for(const k of await caches.keys())await caches.delete(k);location.reload();}},'پاک کردن کش و بارگذاری مجدد'))));
  if(!UPD.info)checkForUpdate({silent:true}).then(paint);
}

/* builder */
function viewBuilder(id){
  const ex=id&&id!=='new'?getForm(id):null;
  if(id&&id!=='new'&&!ex)return notFound();
  const draft=ex?JSON.parse(JSON.stringify(ex)):{id:uid(),title:'',description:'',fields:[]};
  const listEl=h('div',{});
  const move=(i,d)=>{const j=i+d;[draft.fields[i],draft.fields[j]]=[draft.fields[j],draft.fields[i]];drawList();};
  function drawList(){
    listEl.innerHTML='';
    if(!draft.fields.length)listEl.append(h('div',{class:'empty sm'},'هنوز فیلدی اضافه نشده است.'));
    draft.fields.forEach((f,i)=>{
      const sub=f.type==='subform'?getForm(f.subformId):null;
      const info=TYPES[f.type].label+(f.type==='imageradio'?` · ${fa((f.choices||[]).length)} گزینه`:'')+(f.type==='file'?(f.accept==='image'?' · فقط تصویر':'')+(f.multiple?' · چندتایی':''):'')+(f.required?' · اجباری':'')+(f.type==='subform'?` · «${sub?sub.title:'؟'}» · ${f.mode==='inline'?'درون‌خط':'دیالوگ'} · ${f.multiple?'چندرکوردی':'تک‌رکوردی'}`:'');
      listEl.append(h('div',{class:'fcard'},
        h('div',{class:'fmain'},h('b',{},f.label),h('div',{class:'muted sm'},info)),
        h('div',{class:'fbtns'},
          h('button',{class:'icon-btn',disabled:i===0,'aria-label':'بالا',onclick:()=>move(i,-1)},'↑'),
          h('button',{class:'icon-btn',disabled:i===draft.fields.length-1,'aria-label':'پایین',onclick:()=>move(i,1)},'↓'),
          h('button',{class:'icon-btn','aria-label':'ویرایش',onclick:()=>openFieldEditor(draft,f,nf=>{draft.fields[i]=nf;drawList();})},'✎'),
          h('button',{class:'icon-btn','aria-label':'حذف',onclick:()=>{if(confirm('این فیلد حذف شود؟')){draft.fields.splice(i,1);drawList();}}},'✕'))));
    });
  }
  function saveForm(){
    if(!draft.title.trim()){toast('عنوان فرم را وارد کنید');return;}
    if(!draft.fields.length){toast('حداقل یک فیلد اضافه کنید');return;}
    draft.title=draft.title.trim();
    const forms=Store.forms;const i=forms.findIndex(x=>x.id===draft.id);
    if(i>=0)forms[i]=draft;else forms.push(draft);
    try{Store.forms=forms;}catch(e){toast('حافظهٔ مرورگر پر است؛ تصویرها را کمتر یا کوچک‌تر کنید');return;}
    toast('فرم ذخیره شد');location.hash='#/forms';
  }
  drawList();
  page({title:ex?'ویرایش فرم':'فرم جدید',back:'#/forms',actions:[h('button',{class:'icon-btn','aria-label':'ذخیره',onclick:saveForm},'✓')]},
    h('div',{class:'card'},
      h('label',{class:'row'},h('span',{},'عنوان فرم'),h('input',{type:'text',value:draft.title,placeholder:'مثلاً: ثبت مشتری',oninput:e=>{draft.title=e.target.value;}})),
      h('label',{class:'row'},h('span',{},'توضیحات (اختیاری)'),h('input',{type:'text',value:draft.description||'',oninput:e=>{draft.description=e.target.value;}})),
      h('label',{class:'chk'},h('input',{type:'checkbox',checked:!!draft.telegram,onchange:e=>{draft.telegram=e.target.checked;}}),'در ربات تلگرام قابل پر کردن باشد'),
      h('label',{class:'row'},h('span',{},'روش پر کردن در تلگرام'),h('select',{onchange:e=>{draft.tgMode=e.target.value;}},
        h('option',{value:'steps',selected:draft.tgMode!=='mini'},'مرحله‌به‌مرحله (سؤال و جواب)'),
        h('option',{value:'mini',selected:draft.tgMode==='mini'},'کل فرم یکجا (Mini App)')))),
    h('h3',{},'فیلدها'),listEl,
    h('div',{class:'btn-row'},
      h('button',{class:'btn',onclick:()=>openFieldEditor(draft,null,nf=>{draft.fields.push(nf);drawList();})},'＋ افزودن فیلد'),
      h('button',{class:'btn primary',onclick:saveForm},'ذخیره فرم')));
}

function openFieldEditor(draft,field,onSave){
  const f=field?JSON.parse(JSON.stringify(field)):{id:uid(),label:'',type:'text',required:false,options:[]};
  const eligible=Store.forms.filter(g=>g.id!==draft.id&&!usesForm(g.id,draft.id));
  const cfg=h('div',{});
  const num=v=>v===''||v==null||isNaN(+v)?undefined:+v;
  const row=(label,ctl)=>h('label',{class:'row'},h('span',{},label),ctl);
  const numIn=(key,ph)=>h('input',{type:'number',step:'any',placeholder:ph,value:f[key]??'',oninput:e=>{f[key]=num(e.target.value);}});
  function drawCfg(){
    cfg.innerHTML='';const t=f.type;
    if(TYPES[t].opts)cfg.append(row('گزینه‌ها (هر گزینه در یک خط)',h('textarea',{rows:5,value:(f.options||[]).join('\n'),oninput:e=>{f.options=e.target.value.split('\n').map(s=>s.trim()).filter(Boolean);}})));
    if(TYPES[t].choices){
      if(!Array.isArray(f.choices)||!f.choices.length)f.choices=[{label:'',img:''},{label:'',img:''}];
      const list=h('div',{class:'choices'});
      const draw=()=>{
        list.innerHTML='';
        f.choices.forEach((c,i)=>{
          const file=h('input',{type:'file',accept:'image/*',hidden:true,onchange:async e=>{
            const fl=e.target.files[0];e.target.value='';if(!fl)return;
            try{c.img=await fileToDataURL(fl);draw();}catch(er){toast(er.message);}}});
          const thumb=h('button',{type:'button',class:'ch-thumb','aria-label':'انتخاب تصویر',onclick:()=>file.click()},
            c.img?h('img',{src:c.img,alt:''}):h('span',{class:'muted sm'},'تصویر'));
          list.append(h('div',{class:'ch-row'},thumb,file,
            h('div',{class:'ch-main'},
              h('input',{type:'text',placeholder:`عنوان گزینهٔ ${fa(i+1)}`,value:c.label,oninput:e=>{c.label=e.target.value;}}),
              c.img?h('button',{type:'button',class:'btn ch-rm',onclick:()=>{c.img='';draw();}},'حذف تصویر'):null),
            h('button',{type:'button',class:'icon-btn','aria-label':'حذف گزینه',onclick:()=>{f.choices.splice(i,1);draw();}},'✕')));
        });
      };
      draw();
      cfg.append(h('div',{class:'row'},h('span',{},'گزینه‌ها و تصویر هر گزینه'),list,
        h('button',{type:'button',class:'btn',onclick:()=>{f.choices.push({label:'',img:''});draw();}},'＋ افزودن گزینه'),
        h('div',{class:'help'},'تصویرها خودکار کوچک می‌شوند (حداکثر ۳۶۰ پیکسل) تا حافظه کمتر پر شود.')));
    }
    if(['text','textarea','email','tel','url','number'].includes(t))cfg.append(row('متن راهنمای داخل فیلد',h('input',{type:'text',value:f.placeholder||'',oninput:e=>{f.placeholder=e.target.value;}})));
    if(t==='number')cfg.append(h('div',{class:'pair'},row('حداقل',numIn('min')),row('حداکثر',numIn('max'))));
    if(t==='range')cfg.append(h('div',{class:'pair'},row('حداقل',numIn('min','0')),row('حداکثر',numIn('max','100'))),row('گام',numIn('step','1')));
    if(t==='rating')cfg.append(row('تعداد ستاره',numIn('max','5')));
    if(t==='file'){
      cfg.append(row('نوع فایل',h('select',{onchange:e=>{f.accept=e.target.value;}},h('option',{value:'any',selected:f.accept!=='image'},'هر فایل یا تصویر'),h('option',{value:'image',selected:f.accept==='image'},'فقط تصویر'))));
      cfg.append(h('label',{class:'chk'},h('input',{type:'checkbox',checked:!!f.multiple,onchange:e=>{f.multiple=e.target.checked;drawCfg();}}),'امکان ارسال چند فایل'));
      if(f.multiple)cfg.append(row('حداکثر تعداد فایل',numIn('maxFiles','5')));
      cfg.append(row('حداکثر حجم هر فایل (مگابایت)',numIn('maxMB','10')));
      cfg.append(h('label',{class:'chk'},h('input',{type:'checkbox',checked:f.resize!==false,onchange:e=>{f.resize=e.target.checked;}}),'کوچک‌سازی خودکار تصویر (حداکثر ۱۶۰۰ پیکسل)'));
      cfg.append(h('div',{class:'help'},'فایل‌ها در حافظهٔ مرورگر (نه در داخل متن فرم) ذخیره می‌شوند. در تلگرام حداکثر حجم قابل دریافت ۲۰ مگابایت است.'));
    }
    if(t==='subform'){
      if(!eligible.length){cfg.append(h('div',{class:'note'},'برای استفاده از زیرفرم ابتدا یک فرم دیگر بسازید و ذخیره کنید.'));return;}
      if(!eligible.some(g=>g.id===f.subformId))f.subformId=eligible[0].id;
      f.mode=f.mode||'dialog';
      cfg.append(
        row('فرم مورد استفاده',h('select',{onchange:e=>{f.subformId=e.target.value;}},eligible.map(g=>h('option',{value:g.id,selected:g.id===f.subformId},g.title)))),
        row('نحوهٔ نمایش',h('select',{onchange:e=>{f.mode=e.target.value;}},
          h('option',{value:'dialog',selected:f.mode==='dialog'},'پنجرهٔ دیالوگی'),
          h('option',{value:'inline',selected:f.mode==='inline'},'درون‌خط (داخل همین فرم)'))),
        h('label',{class:'chk'},h('input',{type:'checkbox',checked:!!f.multiple,onchange:e=>{f.multiple=e.target.checked;}}),'امکان ثبت چند رکورد'));
    }
  }
  const body=h('div',{},
    row('عنوان فیلد',h('input',{type:'text',value:f.label,oninput:e=>{f.label=e.target.value;}})),
    row('نوع فیلد',h('select',{onchange:e=>{f.type=e.target.value;drawCfg();}},Object.entries(TYPES).map(([k,v])=>h('option',{value:k,selected:k===f.type},v.label)))),
    cfg,
    row('توضیح زیر عنوان (اختیاری)',h('input',{type:'text',value:f.help||'',oninput:e=>{f.help=e.target.value;}})),
    h('label',{class:'chk'},h('input',{type:'checkbox',checked:!!f.required,onchange:e=>{f.required=e.target.checked;}}),'فیلد اجباری باشد'));
  drawCfg();
  openDialog(body,{title:field?'ویرایش فیلد':'فیلد جدید',footer:d=>[
    h('button',{class:'btn primary',onclick:()=>{
      if(!f.label.trim())return toast('عنوان فیلد را وارد کنید');
      if(TYPES[f.type].opts&&!(f.options||[]).length)return toast('حداقل یک گزینه وارد کنید');
      if(f.type==='subform'&&!f.subformId)return toast('یک فرم برای زیرفرم انتخاب کنید');
      if(f.type==='imageradio'){
        const cleaned=(f.choices||[]).filter(c=>c.label.trim()||c.img).map(c=>({label:c.label.trim(),img:c.img||''}));
        if(cleaned.length<2)return toast('حداقل دو گزینه لازم است');
        if(cleaned.some(c=>!c.label))return toast('برای همهٔ گزینه‌ها عنوان وارد کنید');
        if(new Set(cleaned.map(c=>c.label)).size!==cleaned.length)return toast('عنوان گزینه‌ها نباید تکراری باشد');
        f.choices=cleaned;
      }else delete f.choices;
      f.label=f.label.trim();
      if(f.type!=='subform'){delete f.subformId;delete f.mode;delete f.multiple;}
      onSave(f);d.close();}},'ذخیره'),
    h('button',{class:'btn',onclick:()=>d.close()},'انصراف')]});
}

/* fill */
function viewFill(fid,rid){
  const f=getForm(fid);if(!f)return notFound();
  const rec=rid?recordsOf(fid).find(r=>r.id===rid):null;
  if(rid&&!rec)return notFound();
  const ui=buildFormUI(f,rec?rec.data:{},0);
  const submit=again=>{
    if(!ui.validate()){toast('لطفاً خطاهای فرم را برطرف کنید');return;}
    const arr=recordsOf(fid);
    if(rec){const i=arr.findIndex(r=>r.id===rid);arr[i]={...rec,data:ui.get(),updatedAt:Date.now()};}
    else{const nr={id:uid(),createdAt:Date.now(),data:ui.get()};arr.push(nr);setTimeout(()=>notifyRecord(f,nr),0);}
    setRecords(fid,arr);toast('ذخیره شد');
    if(again)route();else location.hash=`#/records/${fid}`;
  };
  page({title:f.title,back:rec?`#/records/${fid}`:'#/forms'},
    f.description?h('p',{class:'muted'},f.description):null,
    h('div',{class:'card'},ui.el),
    h('div',{class:'btn-row'},
      h('button',{class:'btn primary',onclick:()=>submit(false)},rec?'ذخیرهٔ تغییرات':'ذخیره'),
      rec?null:h('button',{class:'btn',onclick:()=>submit(true)},'ذخیره و ثبت جدید')));
}

/* records */
const fmtDT=ts=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{dateStyle:'medium',timeStyle:'short'}).format(new Date(ts));}catch{return new Date(ts).toLocaleString();}};
const csvCell=s=>{s=String(s??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
function viewRecords(fid){
  const f=getForm(fid);if(!f)return notFound();
  const recs=recordsOf(fid);
  const exportCsv=()=>{
    const head=[...f.fields.map(x=>x.label),'تاریخ ثبت'];
    const rows=recs.map(r=>[...f.fields.map(x=>plain(x,r.data[x.id])),fmtDT(r.createdAt)]);
    download(`${f.title}.csv`,'\ufeff'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
  };
  const exportJson=()=>download(`${f.title}.json`,JSON.stringify({form:f,records:recs},null,1),'application/json');
  const list=recs.length?recs.map((r,i)=>h('details',{class:'card rec'},
    h('summary',{},h('span',{class:'rec-n'},fa(i+1)),h('span',{class:'rec-sum'},summarize(f,r.data)||'(خالی)'),h('span',{class:'muted sm'},fmtDT(r.createdAt))),
    r.source?h('p',{class:'muted sm',style:'margin:8px 0 0'},`ثبت‌شده از تلگرام: ${r.source.name||''}${r.source.username?' (@'+r.source.username+')':''}`):null,
    renderReadonly(f,r.data,0),
    h('div',{class:'btn-row'},
      h('a',{class:'btn',href:`#/fill/${fid}/${r.id}`},'ویرایش'),
      h('button',{class:'btn danger',onclick:()=>{if(confirm('این رکورد حذف شود؟')){setRecords(fid,recordsOf(fid).filter(x=>x.id!==r.id));viewRecords(fid);}}},'حذف'))))
    :h('div',{class:'empty'},'هنوز رکوردی ثبت نشده است.');
  page({title:`رکوردهای ${f.title}`,back:'#/forms'},
    h('div',{class:'btn-row',style:'margin:0 0 12px'},
      h('a',{class:'btn primary',href:`#/fill/${fid}`},'＋ رکورد جدید'),
      recs.length?h('button',{class:'btn',onclick:exportCsv},'خروجی CSV'):null,
      recs.length?h('button',{class:'btn',onclick:exportJson},'خروجی JSON'):null),
    list);
}

/* ---- Telegram collector: ارسال فرم از طریق ربات و جمع‌آوری پاسخ‌ها ----
   دریافت پیام‌ها با long polling (getUpdates) از داخل برنامه انجام می‌شود، پس فقط تا وقتی برنامه باز است فعال است.
   پیام‌هایی که در زمان بسته‌بودن برنامه برسند تا ~۲۴ ساعت نزد تلگرام می‌مانند و با باز شدن برنامه پردازش می‌شوند. */
const toLatin=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/[،,]/g,'');
const tg=(method,body,signal)=>botCall('telegram',method,body,signal);
const tbtn=(text,data)=>({text,callback_data:data});
const tsend=(chat,text,kb)=>tg('sendMessage',{chat_id:chat,text,...(kb&&kb.length?{reply_markup:{inline_keyboard:kb}}:{})});

async function tgUpload(method,fields,files){
  const c=DB.get('telegram',{});
  const base=(c.baseUrl||PLATFORMS.telegram.base).replace(/\/+$/,'');
  const fd=new FormData();
  for(const k in fields)fd.append(k,typeof fields[k]==='string'||typeof fields[k]==='number'?String(fields[k]):JSON.stringify(fields[k]));
  for(const k in files)fd.append(k,files[k],k+'.jpg');
  const res=await fetch(`${base}/bot${c.token}/${method}`,{method:'POST',body:fd});
  const j=await res.json().catch(()=>({}));
  if(!res.ok||j.ok===false)throw new Error(j.description||('خطای HTTP '+res.status));
  return j.result;
}

if(IS_MINI)document.documentElement.classList.add('mini');
const b64uEnc=u8=>{let b='';for(let i=0;i<u8.length;i+=0x8000)b+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const b64uDec=t=>{const b=atob(t.replace(/-/g,'+').replace(/_/g,'/'));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function streamBytes(stream,u8){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer());}
async function pack(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream==='function'){try{return 'z.'+b64uEnc(await streamBytes(new CompressionStream('deflate-raw'),raw));}catch{}}
  return 'j.'+b64uEnc(raw);
}
async function unpack(t){
  const k=t.slice(0,2),u=b64uDec(t.slice(2));
  if(k==='z.'){if(typeof DecompressionStream!=='function')throw new Error('مرورگر از فشرده‌سازی پشتیبانی نمی‌کند');return JSON.parse(new TextDecoder().decode(await streamBytes(new DecompressionStream('deflate-raw'),u)));}
  if(k==='j.')return JSON.parse(new TextDecoder().decode(u));
  throw new Error('قالب لینک نامعتبر است');
}
function collectForms(root){
  const out=[],seen=new Set();
  (function walk(id){
    if(seen.has(id))return;seen.add(id);
    const f=getForm(id);if(!f)return;out.push(f);
    f.fields.forEach(x=>{if(x.type==='subform'&&x.subformId)walk(x.subformId);});
  })(root);
  return out;
}
const miniDef=form=>{
  const forms=collectForms(form.id).map(f=>({id:f.id,title:f.title,...(f.description?{description:f.description}:{}),
    fields:f.fields.map(x=>x.type==='imageradio'?{...x,choices:(x.choices||[]).map(c=>({label:c.label})),numbered:true}:x.type==='file'?{id:x.id,label:x.label,type:'file',deferred:true,nested:f.id!==form.id,...(x.help?{help:x.help}:{})}:x)}));
  return {v:1,id:form.id,forms};
};
const miniBase=()=>{
  const c=DB.get('telegram',{});let u=(c.appUrl||'').trim();
  if(!u&&/^https:/.test(location.href)&&!/^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname))u=location.origin+location.pathname;
  if(!/^https:\/\//i.test(u))return '';
  return u.replace(/[?#].*$/,'').replace(/index\.html$/,'');
};
const MINI_URL_MAX=2000;
async function miniUrl(form){
  const base=miniBase();if(!base)return {error:'آدرس عمومی https برنامه در «تنظیمات تلگرام» وارد نشده است.'};
  const url=base+'?m='+await pack(miniDef(form));
  if(url.length>MINI_URL_MAX)return {error:`فرم برای حالت Mini App بزرگ است (${url.length} نویسه؛ حداکثر ${MINI_URL_MAX}).`};
  return {url};
}
async function sendChoicePhotos(chat,form){
  for(const f of collectForms(form.id)){
    for(const x of f.fields){
      if(x.type!=='imageradio')continue;
      for(let i=0;i<(x.choices||[]).length;i++){
        const ch=x.choices[i];if(!ch.img)continue;
        try{const blob=await (await fetch(ch.img)).blob();
          await tgUpload('sendPhoto',{chat_id:chat,caption:`«${x.label}» — گزینهٔ ${fa(i+1)}: ${ch.label}`},{photo:blob});await sleep(50);}
        catch(e){console.warn('mini photo',e);}
      }
    }
  }
}

    reply_markup:{keyboard:[[{text:'📝 باز کردن فرم',web_app:{url:r.url}}]],resize_keyboard:true,one_time_keyboard:true}});

function validateData(form,data,path=''){
  if(!data||typeof data!=='object'||Array.isArray(data))return {error:'ساختار داده نامعتبر است'};
  const out={};
  for(const f of form.fields){
    let v=data[f.id];
    const empty=v==null||v===''||(Array.isArray(v)&&!v.length);
    if(f.type==='file'){out[f.id]=[];continue;}  // فایل در Mini App بعد از ثبت از طریق چت گرفته می‌شود
    if(f.type==='subform'){
      const sub=getForm(f.subformId);if(!sub)continue;
      if(empty){if(f.required)return {error:`«${f.label}» الزامی است`};out[f.id]=f.multiple?[]:{};continue;}
      const items=f.multiple?(Array.isArray(v)?v:[v]):[v];const res=[];
      for(const it of items){const r=validateData(sub,it);if(r.error)return r.error;res.push(r.value);}
      out[f.id]=f.multiple?res:res[0];continue;
    }
    if(empty){
      if(f.required&&!['boolean','range','color'].includes(f.type))return {error:`«${f.label}» الزامی است`};
      out[f.id]=v??emptyValue(f);continue;
    }
    if(['select','radio','imageradio'].includes(f.type)&&!optsOf(f).includes(v))return {error:`گزینهٔ «${f.label}» معتبر نیست`};
    if(f.type==='checkboxes'){if(!Array.isArray(v)||v.some(x=>!(f.options||[]).includes(x)))return {error:`گزینه‌های «${f.label}» معتبر نیستند`};}
    if(['text','textarea','email','url','tel'].includes(f.type)&&typeof v!=='string')return {error:`مقدار «${f.label}» نامعتبر است`};
    if(['number','range','rating'].includes(f.type)&&typeof v!=='number')return {error:`مقدار «${f.label}» نامعتبر است`};
    out[f.id]=v;
  }
  return {value:out};
}

    await tg('sendMessage',{chat_id:chat,text:'✅ اطلاعات فرم ثبت شد. حالا فایل‌های مربوط را بفرستید:',reply_markup:rm});
    await askAttach(chat,ns);
  }else{
    Sess.set(chat,null);
    await tg('sendMessage',{chat_id:chat,text:'✅ اطلاعات شما ثبت شد. سپاس!\nبرای تکمیل فرم دیگر /forms را بزنید.',reply_markup:rm});
  }
  toast(`رکورد جدید از تلگرام: ${form.title}`);notifyRecord(form,rec);
  const hs=location.hash||'#/';
  if(hs==='#/'||hs==='#/forms'||hs.startsWith('#/records/'+form.id)||hs==='#/reports')route();
}
// صفحهٔ داخل تلگرام
function loadTelegramScript(){
  return new Promise(ok=>{
    if(window.Telegram&&window.Telegram.WebApp)return ok(window.Telegram.WebApp);
    const sc=document.createElement('script');sc.src='https://telegram.org/js/telegram-web-app.js';
    sc.onload=()=>ok(window.Telegram&&window.Telegram.WebApp);sc.onerror=()=>ok(null);
    document.head.appendChild(sc);
  });
}
async function bootMini(){
  const app=$('#app');app.innerHTML='';
  const wrap=h('div',{class:'mini-wrap'});app.append(wrap);
  const fail=t=>{wrap.innerHTML='';wrap.append(h('div',{class:'empty'},t));};
  let def;
  try{def=await unpack(new URLSearchParams(location.search).get('m')||'');}catch(e){return fail('لینک فرم معتبر نیست: '+e.message);}
  def.forms.forEach(f=>{VIRTUAL[f.id]=f;});
  const form=VIRTUAL[def.id];if(!form)return fail('فرم پیدا نشد.');
  const wa=await loadTelegramScript();
  if(wa){try{wa.ready();wa.expand();}catch{}}
  const ui=buildFormUI(form,{},0);
  const hasNum=def.forms.some(f=>f.fields.some(x=>x.numbered));
  const err=h('div',{class:'err'});
  wrap.append(h('h1',{},form.title),form.description?h('p',{class:'desc'},form.description):null,
    hasNum?h('div',{class:'note'},'تصویر هر گزینه در گفتگوی ربات فرستاده شده است؛ شماره‌ها با آن‌ها یکی است.'):null,
    ui.el,err,
    h('div',{class:'btn-row'},h('button',{type:'button',class:'btn primary',onclick:()=>{
      err.textContent='';
      if(!ui.validate()){err.textContent='لطفاً موارد مشخص‌شده را اصلاح کنید.';return;}
      const d=ui.get();
      const clean=o=>{if(Array.isArray(o))return o.map(clean);if(o&&typeof o==='object'){const r={};for(const k in o){const v=clean(o[k]);if(v===''||v==null||(Array.isArray(v)&&!v.length)||(v&&typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length))continue;r[k]=v;}return r;}return o;};
      const payload=JSON.stringify({f:def.id,d:clean(d)});
      if(new TextEncoder().encode(payload).length>4096){err.textContent='حجم پاسخ از حد مجاز تلگرام (۴۰۹۶ بایت) بیشتر است؛ پاسخ‌ها را کوتاه‌تر کنید.';return;}
      if(!wa||!wa.sendData){err.textContent='این صفحه باید از داخل تلگرام و با دکمهٔ «باز کردن فرم» ربات باز شود.';return;}
      wa.sendData(payload);
    }},'ثبت و ارسال')));
}

const cbKeyboard=(f,sel)=>[...(f.options||[]).map((o,i)=>[tbtn((sel.includes(i)?'✅ ':'⬜ ')+o,'c:'+i)]),[tbtn('تأیید','ok')]];
async function askField(chat,f,s){
  let text=f.label+(f.required?' *':'');
  if(f.help)text+='\n'+f.help;
  let kb=[];
  switch(f.type){
    case 'select':case 'radio':case 'imageradio':kb=optsOf(f).map((o,i)=>[tbtn(o,`s:${s.q.n}:${i}`)]);break;
    case 'checkboxes':kb=cbKeyboard(f,s.q.sel);text+='\n(چند گزینه را انتخاب کنید و «تأیید» بزنید)';break;
    case 'boolean':kb=[[tbtn('بله','y'),tbtn('خیر','n')]];break;
    case 'rating':{const max=f.max||5;const btns=[];for(let i=1;i<=max;i++)btns.push(tbtn(fa(i),'r:'+i));for(let i=0;i<btns.length;i+=5)kb.push(btns.slice(i,i+5));break;}
    case 'number':text+=`\n(عدد${f.min!=null?'، حداقل '+fa(f.min):''}${f.max!=null?'، حداکثر '+fa(f.max):''})`;break;
    case 'range':text+=`\n(عددی بین ${fa(f.min??0)} و ${fa(f.max??100)})`;break;
    case 'jdate':text+='\n(تاریخ شمسی، مثال: ۱۴۰۵/۰۸/۲۸)';break;
    case 'date':text+='\n(تاریخ میلادی، مثال: 2026-11-20)';break;
    case 'time':text+='\n(ساعت، مثال: 14:30)';break;
    case 'color':text+='\n(کد رنگ، مثال: #ff8800)';break;
    case 'email':text+='\n(مثال: name@example.com)';break;
    case 'url':text+='\n(مثال: https://example.com)';break;
    case 'file':text+=`\n(${f.accept==='image'?'تصویر':'فایل یا تصویر'} را بفرستید${f.multiple?'؛ چند مورد را یکی‌یکی بفرستید و «تمام» بزنید':''})`;break;
  }
  if(f.type==='imageradio')return askImageRadio(chat,f,s,text);
  if(!f.required)kb.push([tbtn('رد کردن','skip')]);
  return tsend(chat,text,kb);
}
// هر گزینه یک پیام مستقل است: تصویر + عنوان + دکمهٔ «انتخاب» درست زیر همان تصویر
async function askImageRadio(chat,f,s,text){
  const q=s.q,labels=optsOf(f);q.msgs=[];
  await tsend(chat,text+'\n(زیر هر تصویر روی «انتخاب» بزنید)');
  const rest=[];
  for(let i=0;i<labels.length;i++){
    const ch=f.choices[i];let sent=false;
    if(ch.img){
      try{
        const blob=await (await fetch(ch.img)).blob();
        const r=await tgUpload('sendPhoto',{chat_id:chat,caption:`${fa(i+1)}. ${labels[i]}`,reply_markup:{inline_keyboard:[[tbtn('✔️ انتخاب: '+labels[i],`s:${q.n}:${i}`)]]}},{photo:blob});
        q.msgs[i]=r&&r.message_id||null;sent=true;await sleep(50);
      }catch(e){console.warn('choice image',e);}
    }
    if(!sent){q.msgs[i]=null;rest.push([tbtn(labels[i],`s:${q.n}:${i}`)]);}
  }
  if(!f.required)rest.push([tbtn('رد کردن','skip')]);
  Sess.set(chat,s);
  if(rest.length)await tsend(chat,rest.length===1&&!f.required?'یا:':'سایر گزینه‌ها:',rest);
}
// پس از پاسخ، دکمه‌های تصویرها حذف و گزینهٔ انتخاب‌شده علامت می‌خورد
function closeChoices(chat,f,msgs,value){
  const labels=optsOf(f);
  for(let i=0;i<msgs.length;i++){
    const id=msgs[i];if(!id)continue;
    const kb={inline_keyboard:[]};
    (labels[i]===value
      ?tg('editMessageCaption',{chat_id:chat,message_id:id,caption:`✅ ${fa(i+1)}. ${labels[i]}`,reply_markup:kb})
      :tg('editMessageReplyMarkup',{chat_id:chat,message_id:id,reply_markup:kb})).catch(()=>{});
  }
}

async function ask(chat,s){
  for(;;){
    const fr=s.stack[s.stack.length-1];
    const form=getForm(fr.formId);
    if(!form){Sess.set(chat,null);return tsend(chat,'این فرم دیگر وجود ندارد. /forms');}
    const f=form.fields[fr.i];
    if(!f){
      if(s.stack.length===1)return finish(chat,s);
      s.stack.pop();
      const par=s.stack[s.stack.length-1];
      const pf=getForm(par.formId).fields[par.i];
      if(pf.multiple){
        par.data[pf.id]=[...(par.data[pf.id]||[]),fr.data];
        s.q={t:'more'};Sess.set(chat,s);
        return tsend(chat,`«${pf.label}»: ${fa(par.data[pf.id].length)} مورد ثبت شد. مورد دیگری اضافه می‌کنید؟`,[[tbtn('➕ بله','m:y'),tbtn('تمام','m:n')]]);
      }
      par.data[pf.id]=fr.data;par.i++;continue;
    }
    if(f.type==='subform'){
      const sub=getForm(f.subformId);
      if(!sub){fr.i++;continue;}
      if(!f.required&&fr.optDone!==fr.i){
        fr.optDone=fr.i;s.q={t:'subopt'};Sess.set(chat,s);
        return tsend(chat,`می‌خواهید «${f.label}» را وارد کنید؟`,[[tbtn('بله','so:y'),tbtn('رد کردن','so:n')]]);
      }
      s.stack.push({formId:f.subformId,i:0,data:{}});
      await tsend(chat,`▫️ ${f.label}`);
      continue;
    }
    s.q={t:'f',sel:[],n:(s.qn=(s.qn||0)+1)};Sess.set(chat,s);
    return askField(chat,f,s);
  }
}

const curField=s=>{const fr=s.stack[s.stack.length-1];const form=getForm(fr.formId);return form&&form.fields[fr.i]?{fr,f:form.fields[fr.i]}:null;};
async function setAnswer(chat,s,value){
  const c=curField(s);if(!c)return;
  const msgs=c.f.type==='imageradio'&&s.q&&s.q.msgs;
  c.fr.data[c.f.id]=value;c.fr.i++;
  if(msgs)closeChoices(chat,c.f,msgs,value);
  return ask(chat,s);
}
const emptyValue=f=>f.type==='checkboxes'||f.type==='file'?[]:f.type==='boolean'?false:'';

function parseText(f,raw){
  if(f.type==='file')return {error:'لطفاً فایل یا تصویر بفرستید (نه متن).'};
  const t=raw.trim();
  const bad=m=>({error:m});
  switch(f.type){
    case 'text':case 'textarea':return t?{value:t}:bad('لطفاً متن وارد کنید.');
    case 'number':case 'range':{
      const n=Number(toLatin(t).trim());
      if(t===''||isNaN(n))return bad('لطفاً یک عدد وارد کنید.');
      const mn=f.type==='range'?(f.min??0):f.min,mx=f.type==='range'?(f.max??100):f.max;
      if(mn!=null&&n<mn)return bad(`حداقل مقدار ${fa(mn)} است.`);
      if(mx!=null&&n>mx)return bad(`حداکثر مقدار ${fa(mx)} است.`);
      return {value:n};
    }
    case 'email':return /^\S+@\S+\.\S+$/.test(t)?{value:t}:bad('ایمیل معتبر نیست.');
    case 'url':try{new URL(t);return {value:t};}catch{return bad('آدرس معتبر نیست.');}
    case 'tel':{const v=toLatin(t).replace(/[\s\-()]/g,'');return /^\+?\d{5,15}$/.test(v)?{value:v}:bad('شمارهٔ تلفن معتبر نیست.');}
    case 'jdate':{
      const m=toLatin(t).match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
      if(!m)return bad('تاریخ را به‌شکل ۱۴۰۵/۰۸/۲۸ وارد کنید.');
      const y=+m[1],mo=+m[2],d=+m[3];
      try{if(mo<1||mo>12||d<1||d>J.mlen(y,mo))return bad('این تاریخ وجود ندارد.');}catch{return bad('سال معتبر نیست.');}
      return {value:fmtJ(y,mo,d)};
    }
    case 'date':{
      const m=toLatin(t).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if(!m)return bad('تاریخ را به‌شکل 2026-11-20 وارد کنید.');
      const dt=new Date(+m[1],+m[2]-1,+m[3]);
      if(dt.getMonth()!==+m[2]-1||dt.getDate()!==+m[3])return bad('این تاریخ وجود ندارد.');
      return {value:`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`};
    }
    case 'time':{
      const m=toLatin(t).match(/^([01]?\d|2[0-3]):([0-5]\d)$/);
      return m?{value:`${pad(+m[1])}:${m[2]}`}:bad('ساعت را به‌شکل 14:30 وارد کنید.');
    }
    case 'color':{const m=t.match(/^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/);return m?{value:'#'+m[1].toLowerCase()}:bad('کد رنگ معتبر نیست، مثال: #ff8800');}
    case 'select':case 'radio':case 'imageradio':{const o=optsOf(f).find(x=>x===t);return o?{value:o}:bad('لطفاً یکی از گزینه‌ها را با دکمه‌ها انتخاب کنید.');}
    case 'boolean':if(/^(بله|آره|yes|y)$/i.test(t))return {value:true};if(/^(خیر|نه|no|n)$/i.test(t))return {value:false};return bad('از دکمه‌های «بله» و «خیر» استفاده کنید.');
    case 'rating':{const n=Number(toLatin(t));const mx=f.max||5;return Number.isInteger(n)&&n>=1&&n<=mx?{value:n}:bad(`عددی بین ۱ تا ${fa(mx)} بفرستید یا از دکمه‌ها استفاده کنید.`);}
    case 'checkboxes':return bad('گزینه‌ها را با دکمه‌ها انتخاب کنید و «تأیید» بزنید.');
  }
  return bad('پاسخ نامعتبر است.');
}
