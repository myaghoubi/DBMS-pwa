const fileKind=m=>{
  const mk=(o,name,type)=>({id:o.file_id,size:o.file_size||0,name:o.file_name||name,type:o.mime_type||type});
  if(m.photo&&m.photo.length)return mk(m.photo[m.photo.length-1],`photo-${m.message_id}.jpg`,'image/jpeg');
  if(m.document)return mk(m.document,'file','application/octet-stream');
  if(m.video)return mk(m.video,`video-${m.message_id}.mp4`,'video/mp4');
  if(m.audio)return mk(m.audio,`audio-${m.message_id}.mp3`,'audio/mpeg');
  if(m.voice)return mk(m.voice,`voice-${m.message_id}.ogg`,'audio/ogg');
  return null;
};
async function acceptFile(f,m){
  const k=fileKind(m);if(!k)return {error:'لطفاً فایل یا تصویر بفرستید (نه متن).'};
  try{checkFile(f,k.name,k.type,k.size);}catch(e){return {error:e.message};}
  if(k.size>20*1048576)return {error:'تلگرام اجازهٔ دریافت فایل بیشتر از ۲۰ مگابایت را به ربات نمی‌دهد.'};
  try{return {meta:await putBlob(f,await tgDownload(k.id),k.name,k.type,false)};}
  catch(e){ // مثلاً CORS یا خطای شبکه: فقط شناسهٔ فایل در تلگرام ثبت می‌شود و بعداً می‌توان دریافتش کرد
    console.warn('tg file',e);
    return {meta:{id:uid(),name:k.name,type:k.type,size:k.size,tg:{file_id:k.id}}};
  }
}
const fileLim=f=>f.multiple?(f.maxFiles||5):1;
const moreKb=()=>[[tbtn('تمام ✔','fd')]];
async function onFileMsg(chat,s,c,m){
  const f=c.f,r=await acceptFile(f,m);
  if(r.error)return tsend(chat,'⚠️ '+r.error);
  s.q.files=[...(s.q.files||[]),r.meta];Sess.set(chat,s);
  if(s.q.files.length>=fileLim(f))return setAnswer(chat,s,s.q.files);
  return tsend(chat,`✅ ${fa(s.q.files.length)} فایل دریافت شد. فایل دیگری بفرستید یا «تمام» را بزنید.`,moreKb());
}
// Mini App: فایل‌ها بعد از ثبت فرم از طریق چت گرفته می‌شوند
const attachField=s=>{const a=s.attach,form=getForm(a.formId);return form&&form.fields.find(x=>x.id===a.queue[a.i]);};
async function askAttach(chat,s){
  const f=attachField(s);
  if(!f){Sess.set(chat,null);return tsend(chat,'✅ فایل‌ها هم ثبت شد. سپاس!\nبرای تکمیل فرم دیگر /forms را بزنید.');}
  s.attach.files=[];Sess.set(chat,s);
  const kb=[];if(f.multiple)kb.push(...moreKb());if(!f.required)kb.push([tbtn('رد کردن','skip')]);
  return tsend(chat,`📎 ${f.label}${f.required?' *':''}\n(${f.accept==='image'?'تصویر':'فایل یا تصویر'} را بفرستید${f.multiple?'؛ چند مورد را یکی‌یکی بفرستید و «تمام» بزنید':''})`,kb);
}
async function attachSave(chat,s,files){
  const a=s.attach,f=attachField(s);
  if(f){const arr=recordsOf(a.formId),r=arr.find(x=>x.id===a.recId);if(r){r.data[f.id]=files;setRecords(a.formId,arr);}}
  a.i++;return askAttach(chat,s);
}
async function onAttachFile(chat,s,m){
  const f=attachField(s);if(!f)return;
  const r=await acceptFile(f,m);if(r.error)return tsend(chat,'⚠️ '+r.error);
  s.attach.files=[...(s.attach.files||[]),r.meta];
  if(s.attach.files.length>=fileLim(f))return attachSave(chat,s,s.attach.files);
  Sess.set(chat,s);
  return tsend(chat,`✅ ${fa(s.attach.files.length)} فایل دریافت شد. فایل دیگری بفرستید یا «تمام» را بزنید.`,moreKb());
}
async function onAttachCb(chat,s,data){
  const f=attachField(s);if(!f)return;
  if(data==='skip'){if(f.required)return;return attachSave(chat,s,[]);}
  if(data==='fd'){const fl=s.attach.files||[];if(f.required&&!fl.length)return tsend(chat,'حداقل یک فایل بفرستید.');return attachSave(chat,s,fl);}
}

async function onMessage(m){
  if(!m.chat||m.chat.type!=='private'||!m.from)return;
  const chat=m.chat.id,text=(m.text||'').trim();
  if(m.web_app_data)return onWebAppData(m);
  if(!m.text){
    const s0=Sess.get(chat);
    if(s0&&s0.attach)return onAttachFile(chat,s0,m);
    const c0=s0&&s0.q&&s0.q.t==='f'?curField(s0):null;
    if(c0&&c0.f.type==='file')return onFileMsg(chat,s0,c0,m);
    return s0?tsend(chat,'لطفاً پاسخ را به‌صورت متن بفرستید.'):tsend(chat,'برای شروع /forms را بزنید.');
  }
  const parts=text.split(/\s+/),cmd=parts[0].split('@')[0].toLowerCase();
  if(cmd==='/start'){
    subscribe(m.from,m.chat);
    const payload=parts[1]||'';
    const welcome=DB.get('telegram',{}).welcome||`سلام ${fullName(m.from)} 👋\nبه ربات «${appName()}» خوش آمدید.`;
    await tsend(chat,welcome);
    if(payload.startsWith('f_'))return startForm(chat,m.from,payload.slice(2));
    return showForms(chat);
  }
  if(cmd==='/forms'){subscribe(m.from,m.chat);return showForms(chat);}
  if(cmd==='/cancel'){Sess.set(chat,null);return tg('sendMessage',{chat_id:chat,text:'لغو شد. برای شروع دوباره /forms را بزنید.',reply_markup:{remove_keyboard:true}});}
  if(cmd==='/stop'){markInactive(chat);Sess.set(chat,null);return tsend(chat,'دیگر پیامی برای شما ارسال نمی‌شود. برای عضویت دوباره /start را بزنید.');}
  const s=Sess.get(chat);
  if(s&&s.attach){
    const f=attachField(s);
    if(cmd==='/skip'&&f&&!f.required)return attachSave(chat,s,[]);
    return tsend(chat,'لطفاً فایل را بفرستید (رد کردن: /skip اگر اختیاری است، پایان: /cancel).');
  }
  if(s&&s.mini)return tsend(chat,'برای پر کردن فرم دکمهٔ «📝 باز کردن فرم» را بزنید (یا /cancel).');
  if(!s||!s.q||s.q.t!=='f')return tsend(chat,'برای شروع /forms را بزنید.');
  const c=curField(s);if(!c)return tsend(chat,'برای شروع /forms را بزنید.');
  if(cmd==='/skip'){
    if(c.f.required)return tsend(chat,'این مورد اجباری است.');
    return setAnswer(chat,s,emptyValue(c.f));
  }
  const r=parseText(c.f,text);
  if(r.error)return tsend(chat,'⚠️ '+r.error);
  return setAnswer(chat,s,r.value);
}

async function onCallback(cb){
  const msg=cb.message;if(!msg||!msg.chat||msg.chat.type!=='private')return;
  const chat=msg.chat.id,data=cb.data||'';
  tg('answerCallbackQuery',{callback_query_id:cb.id}).catch(()=>{});
  if(data.startsWith('f:')){subscribe(cb.from,msg.chat);return startForm(chat,cb.from,data.slice(2));}
  const s=Sess.get(chat);
  if(!s)return tsend(chat,'فرمی در حال تکمیل نیست. برای شروع /forms را بزنید.');
  if(s.attach)return onAttachCb(chat,s,data);
  const q=s.q||{};
  if(data==='m:y'&&q.t==='more'){
    const par=s.stack[s.stack.length-1],pf=getForm(par.formId).fields[par.i];
    s.stack.push({formId:pf.subformId,i:0,data:{}});return ask(chat,s);
  }
  if(data==='m:n'&&q.t==='more'){s.stack[s.stack.length-1].i++;return ask(chat,s);}
  if(data==='so:y'&&q.t==='subopt')return ask(chat,s);
  if(data==='so:n'&&q.t==='subopt'){s.stack[s.stack.length-1].i++;return ask(chat,s);}
  if(q.t!=='f')return;
  const c=curField(s);if(!c)return;
  const f=c.f;
  if(data==='skip'){if(f.required)return;return setAnswer(chat,s,emptyValue(f));}
  const sm=data.match(/^s:(\d+):(\d+)$/);
  if(sm&&(f.type==='select'||f.type==='radio'||f.type==='imageradio')){
    if(+sm[1]!==q.n)return;  // دکمهٔ مربوط به سؤال قبلی
    const o=optsOf(f)[+sm[2]];return o==null?undefined:setAnswer(chat,s,o);
  }
  if(data.startsWith('c:')&&f.type==='checkboxes'){
    const i=+data.slice(2);if(!(f.options||[])[i])return;
    const k=q.sel.indexOf(i);k>=0?q.sel.splice(k,1):q.sel.push(i);
    Sess.set(chat,s);
    return tg('editMessageReplyMarkup',{chat_id:chat,message_id:msg.message_id,reply_markup:{inline_keyboard:cbKeyboard(f,q.sel)}}).catch(()=>{});
  }
  if(data==='ok'&&f.type==='checkboxes'){
    if(f.required&&!q.sel.length)return tsend(chat,'حداقل یک گزینه را انتخاب کنید.');
    return setAnswer(chat,s,(f.options||[]).filter((_,i)=>q.sel.includes(i)));
  }
  if(data==='fd'&&f.type==='file'){const fl=q.files||[];if(f.required&&!fl.length)return tsend(chat,'حداقل یک فایل بفرستید.');return setAnswer(chat,s,fl);}
  if((data==='y'||data==='n')&&f.type==='boolean')return setAnswer(chat,s,data==='y');
  if(data.startsWith('r:')&&f.type==='rating'){const n=+data.slice(2);return n>=1&&n<=(f.max||5)?setAnswer(chat,s,n):undefined;}
}

/* ---- واسط Cloudflare Worker ---- */
const relayCfg=()=>{const c=DB.get('telegram',{});return c.relayUrl&&c.relayKey?{url:c.relayUrl.trim().replace(/\/+$/,''),key:c.relayKey.trim()}:null;};
async function relayCall(rl,path,opt={}){
  const res=await fetch(rl.url+path,{...opt,headers:{authorization:'Bearer '+rl.key}});
  const j=await res.json().catch(()=>({}));
  if(!res.ok||j.ok===false)throw new Error('واسط: '+(j.error||('خطای HTTP '+res.status)));
  return j;
}
const relayGet=async(rl,offset,signal)=>(await relayCall(rl,'/updates?offset='+offset,{signal})).result||[];
const relayAck=(rl,upto)=>relayCall(rl,'/ack?upto='+upto,{method:'POST'});
/* ---- polling ---- */
async function startPolling(){
  if(Poll.running)return;
  const c=DB.get('telegram',{});
  if(!c.token)throw new Error('توکن تلگرام وارد نشده است');
  Poll.running=true;Poll.err='';const gen=++Poll.gen;
  DB.set('collector',{on:true});
  const rl=relayCfg();
  try{
    if(rl){
      if(!/^[A-Za-z0-9_-]{8,256}$/.test(rl.key))throw new Error('کلید واسط باید ۸ تا ۲۵۶ نویسه از حروف انگلیسی، عدد، - و _ باشد');
      await tg('setWebhook',{url:rl.url+'/hook',secret_token:rl.key,allowed_updates:['message','callback_query']});
    }else await tg('deleteWebhook',{});
    const me=await tg('getMe');
    DB.set('telegram',{...DB.get('telegram',{}),botUsername:me.username||''});
  }catch(e){Poll.running=false;Poll.err=e.message;DB.set('collector',{on:false});paintCollector();throw e;}
  paintCollector();
  (async()=>{
    while(Poll.running&&gen===Poll.gen){
      try{
        Poll.ctrl=new AbortController();
        const st=DB.get('tgstate',{offset:0});
        const rl2=relayCfg();
        let ups;
        if(rl2){
          ups=await relayGet(rl2,st.offset||0,Poll.ctrl.signal);
          if(!ups.length)await sleep(4000);
        }else ups=await tg('getUpdates',{offset:st.offset||0,timeout:25,allowed_updates:['message','callback_query']},Poll.ctrl.signal);
        Poll.err='';Poll.last=Date.now();Poll.polls++;Poll.received+=ups.length;
        for(const u of ups){
          try{if(u.message)await onMessage(u.message);else if(u.callback_query)await onCallback(u.callback_query);}
          catch(e){console.error('collector',e);}
          DB.set('tgstate',{offset:u.update_id+1});
        }
        if(rl2&&ups.length)relayAck(rl2,ups[ups.length-1].update_id).catch(()=>{});
      }catch(e){
        if(!Poll.running||gen!==Poll.gen)break;
        Poll.err=/409|Conflict/i.test(e.message)?'ربات در جای دیگری هم در حال دریافت پیام است (برنامه در تب یا دستگاه دیگر باز است؟)':e.message;
        paintCollector();await sleep(4000);
      }
      paintCollector();
    }
  })();
}
function stopPolling(){Poll.running=false;Poll.gen++;try{Poll.ctrl&&Poll.ctrl.abort();}catch{}DB.set('collector',{on:false});paintCollector();}

/* ---- sending a form to subscribers ---- */
async function sendFormToSubs(form,ids,intro){
  const res={ok:0,fail:0};
  for(const id of ids){
    try{await tsend(id,intro||`لطفاً فرم «${form.title}» را تکمیل کنید.`,[[tbtn('شروع پر کردن','f:'+form.id)]]);res.ok++;}
    catch(e){res.fail++;if(/blocked|deactivated|chat not found|kicked/i.test(e.message))markInactive(id);}
    await sleep(60);
  }
  return res;
}

async function diagnose(){
  const L=[];const c=DB.get('telegram',{});
  L.push(`نسخهٔ برنامه: ${APP_VERSION}`);
  L.push(`دریافت پیام‌ها در برنامه: ${Poll.running?'روشن':'خاموش'}`+(Poll.running?` (${Poll.polls} بار اتصال موفق، ${Poll.received} پیام دریافت‌شده${Poll.last?'، آخرین: '+new Date(Poll.last).toLocaleTimeString('fa-IR'):''})`:''));
  if(!c.token){L.push('✗ توکن تلگرام ذخیره نشده است.');return L.join('\n');}
  try{const me=await tg('getMe');L.push(`✓ اتصال به تلگرام برقرار است — ربات: @${me.username}`);}
  catch(e){L.push('✗ اتصال به تلگرام ناموفق: '+e.message);return L.join('\n');}
  try{
    const w=await tg('getWebhookInfo');
    L.push(`وب‌هوک: ${w.url?w.url:'(ندارد — درست است)'}`);
    L.push(`پیام‌های در انتظار دریافت در تلگرام: ${w.pending_update_count||0}`);
    if(w.last_error_message)L.push('آخرین خطای وب‌هوک: '+w.last_error_message);
    if(w.url&&!relayCfg())L.push('⚠ وب‌هوک فعال است و جلوی دریافت پیام در برنامه را می‌گیرد؛ «شروع دریافت» آن را حذف می‌کند.');
    if((w.pending_update_count||0)>0&&!Poll.running)L.push('⚠ پیام منتظر است ولی «دریافت پیام‌ها» روشن نیست؛ «شروع دریافت» را بزنید.');
    if((w.pending_update_count||0)>0&&Poll.running)L.push('⚠ پیام‌ها در تلگرام می‌مانند ولی برنامه آن‌ها را نمی‌گیرد؛ شاید برنامه در جای دیگری هم باز است.');
  }catch(e){L.push('✗ خواندن وضعیت وب‌هوک ناموفق: '+e.message);}
  const rl=relayCfg();
  if(rl){
    try{const w=await tg('getWebhookInfo');L.push(w.url===rl.url+'/hook'?'✓ وب‌هوک روی واسط تنظیم است':`✗ وب‌هوک روی واسط نیست (${w.url||'خالی'}) — «شروع دریافت» را بزنید`);}catch{}
    try{await relayGet(rl,Number.MAX_SAFE_INTEGER);L.push('✓ واسط در دسترس است و کلید درست است');}catch(e){L.push('✗ '+e.message);}
  }else L.push('واسط Cloudflare: استفاده نمی‌شود');
  const mf=tgForms().filter(f=>f.tgMode==='mini');
  if(mf.length){
    L.push(`فرم‌های حالت Mini App: ${mf.map(f=>f.title).join('، ')}`);
    L.push(miniBase()?`آدرس عمومی برنامه: ${miniBase()}`:'✗ آدرس عمومی https برنامه (Mini App) وارد نشده است.');
    for(const f of mf){const r=await miniUrl(f);L.push(r.error?`✗ «${f.title}»: ${r.error}`:`✓ «${f.title}»: طول لینک ${r.url.length} نویسه`);}
  }
  const subs=DB.get('tgsubs',[]),fs=tgForms();
  L.push(`مشترکین ثبت‌شده: ${subs.length}`);
  L.push(`فرم‌های فعال برای ربات: ${fs.length}${fs.length?' ('+fs.map(f=>f.title).join('، ')+')':' — هیچ فرمی فعال نیست'}`);
  return L.join('\n');
}

/* ---- UI card (in Telegram settings) ---- */
function collectorCard(){
  const box=h('div',{class:'card'});
  let diagText='';
  function paint(){
    if(!box.isConnected&&box.dataset.painted)return;
    box.dataset.painted='1';
    const c=DB.get('telegram',{}),subs=DB.get('tgsubs',[]);
    const link=c.botUsername?`https://t.me/${c.botUsername}`:'';
    box.replaceChildren(
      h('h2',{},'جمع‌آوری اطلاعات با ربات'),
      h('p',{class:'muted sm'},'افراد با /start عضو ربات می‌شوند، فرم را از ربات دریافت و مرحله‌به‌مرحله پر می‌کنند و پاسخ‌ها در «رکوردها»ی همان فرم ثبت می‌شود.'),
      h('div',{class:'note',id:'col-status'},
        (Poll.running?'در حال دریافت پیام‌ها…':'متوقف')
        +(Poll.running?`\nاتصال موفق: ${fa(Poll.polls)} بار · پیام دریافت‌شده: ${fa(Poll.received)}`:'')
        +(Poll.err?'\n⚠️ '+Poll.err:'')),
      h('div',{class:'btn-row'},
        Poll.running?h('button',{class:'btn',onclick:stopPolling},'توقف دریافت')
          :h('button',{class:'btn primary',onclick:async()=>{try{await startPolling();}catch(e){toast('خطا: '+e.message);}paint();}},'شروع دریافت'),
        h('button',{class:'btn',onclick:async()=>{diagText='در حال بررسی…';paint();try{diagText=await diagnose();}catch(e){diagText='خطا: '+e.message;}paint();}},'عیب‌یابی'),
        link?h('button',{class:'btn',onclick:()=>{navigator.clipboard&&navigator.clipboard.writeText(link).then(()=>toast('لینک ربات کپی شد'),()=>toast('کپی نشد'));}},'کپی لینک'):null),
      h('pre',{id:'col-diag',class:'note sm',hidden:!diagText,style:'white-space:pre-wrap;margin-top:8px'},diagText),
      link?h('p',{class:'sm',dir:'ltr',style:'text-align:right;margin-top:8px'},link):null,
      h('div',{class:'note sm',style:'margin-top:10px'},'دریافت پاسخ‌ها فقط تا وقتی برنامه باز است انجام می‌شود. پیام‌هایی که در زمان بسته‌بودن برنامه برسند تا حدود ۲۴ ساعت نزد تلگرام می‌مانند و با باز شدن برنامه پردازش می‌شوند. هر کس لینک ربات را داشته باشد می‌تواند فرم‌های فعال را پر کند.'),
      h('h3',{style:'margin:14px 0 6px'},`مشترکین (${fa(subs.length)})`),
      subs.length?h('div',{class:'chips'},subs.map(s=>h('div',{class:'chip'},
        h('span',{},`${s.name}${s.username?' (@'+s.username+')':''}${s.active===false?' — غیرفعال':''}`),
        h('button',{class:'icon-btn','aria-label':'حذف',onclick:()=>{if(confirm('این مشترک حذف شود؟')){DB.set('tgsubs',DB.get('tgsubs',[]).filter(x=>x.id!==s.id));paint();}}},'✕'))))
        :h('div',{class:'empty sm'},'هنوز کسی عضو نشده است.'),
      h('p',{class:'muted sm'},'برای ارسال یک فرم به مشترکین، از «مدیریت فرم‌ها» دکمهٔ «ارسال به تلگرام» را بزنید.'));
  }
  paintCollector=()=>{if(box.isConnected)paint();};
  paint();
  return box;
}
document.addEventListener('visibilitychange',()=>{if(!IS_MINI&&document.visibilityState==='visible'&&DB.get('collector',{}).on&&!Poll.running)startPolling().catch(()=>{});});

/* router */
function route(){
  seed();
  if(authOn()&&!currentUser()){viewLogin();return;}
  document.body.classList.remove('locked');
  const [,a,b]=(location.hash||'#/').split('/');
  if(!allowedRoute(a)){closeDrawer();markActive('home');noAccess();return;}
  const c=(location.hash||'#/').split('/')[3];
  closeDrawer();
  markActive(({'':'home',builder:'forms',fill:'forms',records:'forms'})[a]??a);
  try{
    switch(a){
      case 'forms':viewForms();break;
      case 'builder':viewBuilder(b);break;
      case 'fill':viewFill(b,c);break;
      case 'records':viewRecords(b);break;
      case 'reports':viewReports();break;
      case 'users':viewUsers(b);break;
      case 'process':viewProcess();break;
      case 'messenger':viewMessenger();break;
      case 'bale':viewPlatform('bale');break;
      case 'telegram':viewPlatform('telegram');break;
      case 'backup':viewBackup();break;
      case 'update':viewUpdate();break;
      case 'settings':viewSettings();break;
      case 'about':viewAbout();break;
      default:viewHome();
    }
  }catch(e){console.error(e);page({title:'خطا',back:'#/'},h('div',{class:'empty'},'خطایی رخ داد: '+e.message));}
}
window.addEventListener('hashchange',()=>{if(!IS_MINI)route();});
if(IS_MINI){applySettings();bootMini();}
else{
loadLucide();buildDrawer();applySettings();route();scheduleUpdateChecks();setTimeout(checkIfDue,3000);setTimeout(gcFiles,20000);
if(DB.get('collector',{}).on)startPolling().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const had=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloading){reloading=true;location.reload();}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    swReg=r;
    r.addEventListener('updatefound',()=>{checkForUpdate({silent:true});});
  }).catch(()=>{});
}
}
