<style>
@font-face{font-family:"Vazirmatn Local";src:url("fonts/Vazirmatn-variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#f4f5fa;--card:#fff;--fg:#1f2430;--muted:#6b7280;--line:#e3e5ee;--pri:#4f46e5;--pri-fg:#fff;--danger:#dc2626;--ok:#16a34a;--soft:#eef0ff}

:root[data-theme=dark]{--bg:#12141c;--card:#1c1f2b;--fg:#eceef6;--muted:#9aa1b5;--line:#2c3040;--pri:#7c83ff;--pri-fg:#10121a;--danger:#f87171;--soft:#262a45}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0;font-size:17px}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}

p{margin:2px 0}

.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn,button.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}

/* shell */

.pie{width:170px;height:170px}.pie svg{width:100%;height:100%}
.legend{display:flex;flex-direction:column;gap:4px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;margin-top:8px}.tbl td{border-bottom:1px solid var(--line);padding:6px 4px}.tbl td:last-child{text-align:left;font-weight:700}
#upd-banner{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;background:var(--card);color:var(--fg);border:1px solid var(--pri);border-radius:14px;padding:8px 10px 8px 6px;box-shadow:0 8px 26px rgba(0,0,0,.28);max-width:92vw;white-space:nowrap}

.dr-item.has-update::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--danger);margin-inline-start:auto}
.menu-btn.has-update{position:relative}
.menu-btn.has-update::after{content:"";position:absolute;top:6px;left:6px;width:9px;height:9px;border-radius:50%;background:#f59e0b}
.cl{margin-bottom:10px}

.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;font-style:normal}
svg.lucide{width:1.15em;height:1.15em;stroke-width:2;flex:none}
.btn,.fab{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.icon-btn svg.lucide{width:20px;height:20px}
.dr-ic{width:22px;display:inline-flex;justify-content:center}.dr-ic svg.lucide{width:19px;height:19px}
.tile-t{display:flex;align-items:center;gap:8px;font-size:15px}.tile-t svg.lucide{width:18px;height:18px;color:var(--pri)}
.star svg.lucide{width:28px;height:28px}.star.on svg.lucide{fill:currentColor}
.tile{gap:4px;padding:12px 14px}
/* fields */
.field{margin-bottom:14px}
.lbl{font-weight:600;margin-bottom:4px}
.req{color:var(--danger)}
.help{color:var(--muted);font-size:12.5px;margin-bottom:4px}

.field.bad>input,.field.bad>select,.field.bad>textarea,.field.bad>.jd-wrap input{border-color:var(--danger)}

input:focus,select:focus,textarea:focus{border-color:var(--pri)}
input[type=email],input[type=url],input[type=tel]{direction:ltr;text-align:right}
input[type=color]{width:64px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:2px}
input[type=range]{width:100%;accent-color:var(--pri)}
.opt{display:flex;align-items:center;gap:8px;padding:4px 0}
.opt input{width:18px;height:18px;accent-color:var(--pri)}
.stars{display:flex;gap:2px}
.star{font-size:30px;line-height:1;border:0;background:transparent;color:var(--line);cursor:pointer;padding:0 2px}
.star.on{color:#f5a623}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.switch input{display:none}
.slider{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.slider::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+.slider{background:var(--pri)}
.switch input:checked+.slider::after{right:21px}
.rangebox{display:flex;align-items:center;gap:10px}
.rangebox output{min-width:44px;text-align:center;font-weight:700;color:var(--pri)}
.jd-wrap{display:flex;gap:6px}
.jd-wrap input{cursor:pointer}
.field.sub{border:1px dashed var(--line);border-radius:12px;padding:10px;background:rgba(127,127,127,.04)}
.rows{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.row-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card)}
.row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chips{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:10px;padding:4px 6px 4px 10px}
.chip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* builder */
.fcard{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.fmain{flex:1;min-width:0}
.fbtns{display:flex}
.row{display:block;margin-bottom:12px}
.row>span{display:block;font-weight:600;margin-bottom:3px;font-size:14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0}
.chk input{width:18px;height:18px;accent-color:var(--pri)}
.note{background:var(--soft);border-radius:10px;padding:10px;font-size:13.5px}
/* records */
details.rec summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}
details.rec summary::-webkit-details-marker{display:none}
.rec-n{background:var(--pri);color:var(--pri-fg);border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.rec-sum{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dl.ro{margin:12px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px}
dl.ro dt{color:var(--muted)}dl.ro dd{margin:0;min-width:0;overflow-wrap:anywhere}
dl.ro dl.ro{margin:6px 0 0}
.ro-sub{border-inline-start:3px solid var(--soft);padding-inline-start:10px;margin-bottom:6px}
.swatch{display:inline-block;width:22px;height:22px;border-radius:6px;vertical-align:middle;border:1px solid var(--line)}
/* dialog */
dialog.dlg{border:0;border-radius:16px;padding:0;width:min(560px,94vw);max-height:90vh;background:var(--card);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog.dlg[open]{display:flex;flex-direction:column}
dialog.dlg::backdrop{background:rgba(0,0,0,.5)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.dlg-head h3{margin:0;font-size:16px}
.dlg-body{padding:14px;overflow:auto;flex:1}
.dlg-foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-foot .grow{flex:1}
/* calendar */
.cal-nav{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.cal-nav select{flex:1;padding:6px 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .wd{color:var(--muted);font-size:12.5px;padding:4px 0}
.cal-grid button{font:inherit;border:0;background:transparent;color:var(--fg);border-radius:10px;height:40px;cursor:pointer}
.cal-grid button:hover{background:var(--soft)}
.cal-grid button.fri{color:var(--danger)}
.cal-grid button.today{outline:2px solid var(--pri);outline-offset:-2px}
.cal-grid button.sel{background:var(--pri);color:var(--pri-fg)}
#toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>

<body>
<div id="app"></div>
<div id="toast"></div>
<script src="version.js"></script>
<script>
'use strict';
/*J-START*/
const J=(()=>{
  const br=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  const div=(a,b)=>Math.trunc(a/b), mod=(a,b)=>a-Math.trunc(a/b)*b;
  function cal(jy,noLeap){
    const bl=br.length; let gy=jy+621, leapJ=-14, jp=br[0], jm, jump=0, leap, leapG, march, n;
    if(jy<jp||jy>=br[bl-1]) throw new Error('Invalid Jalaali year '+jy);
    for(let i=1;i<bl;i++){
      jm=br[i]; jump=jm-jp;
      if(jy<jm) break;
      leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);
      jp=jm;
    }
    n=jy-jp;
    leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);
    if(mod(jump,33)===4&&jump-n===4) leapJ+=1;
    leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
    march=20+leapJ-leapG;
    if(noLeap) return {gy,march};
    if(jump-n<6) n=n-jump+div(jump+4,33)*33;
    leap=mod(mod(n+1,33)-1,4);
    if(leap===-1) leap=4;
    return {leap,gy,march};
  }
  function g2d(gy,gm,gd){
    let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
    d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
    return d;
  }
  function d2g(jdn){
    let j=4*jdn+139361631;
    j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
    const i=div(mod(j,1461),4)*5+308;
    const gd=div(mod(i,153),5)+1, gm=mod(div(i,153),12)+1, gy=div(j,1461)-100100+div(8-gm,6);
    return {gy,gm,gd};
  }
  function j2d(jy,jm,jd){
    const r=cal(jy,true);
    return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;
  }
  function d2j(jdn){
    const gy=d2g(jdn).gy; let jy=gy-621;
    const r=cal(jy,false), jdn1f=g2d(gy,3,r.march); let k=jdn-jdn1f, jm, jd;
    if(k>=0){
      if(k<=185){ return {jy,jm:1+div(k,31),jd:mod(k,31)+1}; }
      k-=186;
    } else {
      jy-=1; k+=179;
      if(r.leap===1) k+=1;
    }
    jm=7+div(k,30); jd=mod(k,30)+1;
    return {jy,jm,jd};
  }
  return {
    toJ:(gy,gm,gd)=>d2j(g2d(gy,gm,gd)),
    toG:(jy,jm,jd)=>d2g(j2d(jy,jm,jd)),
    isLeap:jy=>cal(jy,false).leap===0,
    mlen(jy,jm){return jm<=6?31:jm<=11?30:(cal(jy,false).leap===0?30:29);}
  };
})();
/*J-END*/

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const FA='۰۱۲۳۴۵۶۷۸۹';
const fa=s=>String(s).replace(/\d/g,d=>FA[d]);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WDAYS=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
function add(e,kids){for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(k));}}
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(['value','checked','disabled','selected','readOnly'].includes(k))e[k]=v;
    else e.setAttribute(k,v===true?'':v);
  }
  add(e,kids);return e;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200);}
function openDialog(content,{title='',footer}={}){
  const d=h('dialog',{class:'dlg'});
  d.append(h('div',{class:'dlg-head'},h('h3',{},title),h('button',{type:'button',class:'icon-btn','aria-label':'بستن',onclick:()=>d.close()},'✕')),h('div',{class:'dlg-body'},content));
  if(footer)d.append(h('div',{class:'dlg-foot'},footer(d)));
  d.addEventListener('close',()=>d.remove());
  d.addEventListener('click',e=>{if(e.target===d)d.close();});
  document.body.append(d);d.showModal();return d;
}

/* ---------- storage ---------- */
function load(k,def){try{const v=JSON.parse(localStorage.getItem(k));return v??def;}catch{return def;}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v));}
const Store={
  get forms(){return load('fb.forms',[]);},set forms(v){save('fb.forms',v);},
  get records(){return load('fb.records',{});},set records(v){save('fb.records',v);}
};
const VIRTUAL={};
const getForm=id=>VIRTUAL[id]||Store.forms.find(f=>f.id===id);
const recordsOf=fid=>Store.records[fid]||[];
function setRecords(fid,arr){const r=Store.records;r[fid]=arr;Store.records=r;}
function usesForm(gid,targetId,seen=new Set()){
  if(seen.has(gid))return false;seen.add(gid);
  const g=getForm(gid);if(!g)return false;
  for(const f of g.fields){
    if(f.type!=='subform')continue;
    if(f.subformId===targetId||usesForm(f.subformId,targetId,seen))return true;
  }
  return false;
}

/* ---------- Jalali display ---------- */
const parseJ=s=>{const p=String(s).split('-').map(Number);return p.length===3&&p.every(n=>!isNaN(n))?{jy:p[0],jm:p[1],jd:p[2]}:null;};
const fmtJ=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
function jdLong(s){
  const p=parseJ(s);if(!p)return '';
  try{const g=J.toG(p.jy,p.jm,p.jd);const dow=new Date(g.gy,g.gm-1,g.gd).getDay();
    return fa(`${WDAYS[dow]} ${p.jd} ${MONTHS[p.jm-1]} ${p.jy}`);}catch{return fa(s.replace(/-/g,'/'));}
}
function todayJ(){const t=new Date();return J.toJ(t.getFullYear(),t.getMonth()+1,t.getDate());}

function openJalaliPicker(cur,cb){
  const td=todayJ();const sel=cur?parseJ(cur):null;
  let y=sel?sel.jy:td.jy,m=sel?sel.jm:td.jm;
  const body=h('div',{class:'cal'});
  const dlg=openDialog(body,{title:'انتخاب تاریخ',footer:d=>[
    h('button',{type:'button',class:'btn primary',onclick:()=>{cb(fmtJ(td.jy,td.jm,td.jd));d.close();}},'امروز'),
    h('button',{type:'button',class:'btn danger',onclick:()=>{cb('');d.close();}},'پاک کردن'),
    h('span',{class:'grow'}),
    h('button',{type:'button',class:'btn',onclick:()=>d.close()},'انصراف')]});
  function draw(){
    body.innerHTML='';
    y=Math.min(1500,Math.max(1300,y));
    const years=[];for(let v=1300;v<=1500;v++)years.push(v);
    const nav=h('div',{class:'cal-nav'},
      h('button',{type:'button',class:'icon-btn','aria-label':'ماه قبل',onclick:()=>{m--;if(m<1){m=12;y--;}draw();}},'›'),
      h('select',{onchange:e=>{m=+e.target.value;draw();}},MONTHS.map((n,i)=>h('option',{value:i+1,selected:i+1===m},n))),

      h('button',{type:'button',class:'icon-btn','aria-label':'ماه بعد',onclick:()=>{m++;if(m>12){m=1;y++;}draw();}},'‹'));
    const g=J.toG(y,m,1);const off=(new Date(g.gy,g.gm-1,g.gd).getDay()+1)%7;
    const grid=h('div',{class:'cal-grid'},['ش','ی','د','س','چ','پ','ج'].map(w=>h('div',{class:'wd'},w)));

      grid.append(h('button',{type:'button',class:cls,onclick:()=>{cb(fmtJ(y,m,d));dlg.close();}},fa(d)));

/* ---------- field types ---------- */
const TYPES={
  text:{label:'متن کوتاه'},textarea:{label:'متن بلند'},number:{label:'عدد'},
  email:{label:'ایمیل'},tel:{label:'تلفن'},url:{label:'آدرس وب'},
  select:{label:'لیست کشویی',opts:1},radio:{label:'تک‌انتخابی (رادیویی)',opts:1},checkboxes:{label:'چندانتخابی (چک‌باکس)',opts:1},
  boolean:{label:'سوییچ بله/خیر'},
  jdate:{label:'تاریخ شمسی (تقویم فارسی)'},date:{label:'تاریخ میلادی'},time:{label:'ساعت'},
  range:{label:'اسلایدر'},rating:{label:'امتیاز ستاره‌ای'},color:{label:'رنگ'},
  subform:{label:'زیرفرم (استفاده از فرم دیگر)'}
};
const isEmpty=v=>v==null||v===''||(Array.isArray(v)&&!v.length);

function plain(f,v){
  if(isEmpty(v))return '';
  switch(f.type){
    case 'checkboxes':return v.join('، ');
    case 'boolean':return v?'بله':'خیر';
    case 'jdate':return v.replace(/-/g,'/');
    case 'subform':{const sub=getForm(f.subformId);if(!sub)return '';return (f.multiple?v:[v]).map(d=>summarize(sub,d)).join(' | ');}
    default:return String(v);
  }
}
function summarize(form,data){
  const parts=[];
  for(const f of form.fields){
    if(['subform','color','rating','boolean','range'].includes(f.type))continue;
    const t=plain(f,data?.[f.id]);
    if(t)parts.push(['email','url','text','textarea','select','radio','checkboxes'].includes(f.type)?t:fa(t));
    if(parts.length>=3)break;
  }
  return parts.map(p=>'⁨'+p+'⁩').join(' · ');
}
function valueNode(f,v,depth=0){
  if(f.type==='subform'){
    const sub=getForm(f.subformId);
    if(!sub||isEmpty(v))return '—';
    if(depth>5)return '…';
    const arr=f.multiple?v:[v];
    return h('div',{},arr.map(d=>h('div',{class:'ro-sub'},renderReadonly(sub,d,depth+1))));
  }
  if(isEmpty(v))return '—';
  switch(f.type){
    case 'color':{const s=h('span',{class:'swatch'});s.style.background=String(v);return h('span',{},s,' ',h('span',{dir:'ltr'},v));}
    case 'rating':{const max=f.max||5;return '★'.repeat(v)+'☆'.repeat(Math.max(0,max-v));}
    case 'jdate':return jdLong(v);
    case 'boolean':return v?'بله':'خیر';
    case 'checkboxes':return v.join('، ');
    case 'number':case 'range':case 'time':case 'date':case 'tel':return fa(v);
    default:return String(v);
  }
}
function renderReadonly(form,data,depth=0){
  return h('dl',{class:'ro'},form.fields.flatMap(f=>[h('dt',{},f.label),h('dd',{},valueNode(f,data?.[f.id],depth))]));
}

/* ---------- form UI (runtime) ---------- */
function buildFormUI(form,data,depth=0){
  const cs=form.fields.map(f=>makeField(f,data?.[f.id],depth));
  const el=h('div',{class:'form-fields'},cs.map(c=>c.el));
  return {
    el,
    get(){const o={};form.fields.forEach((f,i)=>{o[f.id]=cs[i].get();});return o;},
    validate(){
      let ok=true,first=null;
      cs.forEach(c=>{if(!c.validate()){ok=false;first=first||c.el;}});
      if(first)first.scrollIntoView({block:'center',behavior:'smooth'});
      return ok;
    }
  };
}

function makeField(f,value,depth){
  const err=h('div',{class:'err'});
  const wrap=h('div',{class:'field'+(f.type==='subform'?' sub':'')});
  wrap.append(h('div',{class:'lbl'},f.label,f.required&&f.type!=='boolean'?h('span',{class:'req'},' *'):null));
  if(f.help)wrap.append(h('div',{class:'help'},f.help));
  const core=buildControl(f,value,depth);
  wrap.append(core.el,err);
  return {
    el:wrap,get:core.get,
    validate(){
      const v=core.get();let msg='';
      if(core.validate)msg=core.validate(v)||'';
      else if(f.required&&!['boolean','range','color'].includes(f.type)&&isEmpty(v))msg='این فیلد الزامی است';
      if(!msg&&!isEmpty(v)){
        if(f.type==='number'){
          if(f.min!=null&&v<f.min)msg=`حداقل مقدار ${fa(f.min)} است`;
          else if(f.max!=null&&v>f.max)msg=`حداکثر مقدار ${fa(f.max)} است`;
        }
        if(f.type==='email'&&!/^\S+@\S+\.\S+$/.test(v))msg='ایمیل معتبر نیست';
        if(f.type==='url'){try{new URL(v);}catch{msg='آدرس معتبر نیست';}}
      }
      err.textContent=msg;wrap.classList.toggle('bad',!!msg);
      return !msg;
    }
  };
}

function buildControl(f,value,depth){
  switch(f.type){
    case 'text':case 'email':case 'tel':case 'url':case 'number':case 'time':case 'date':case 'color':{
      const attrs={type:f.type,placeholder:f.placeholder};
      if(f.type==='number'){attrs.step='any';attrs.inputmode='decimal';if(f.min!=null)attrs.min=f.min;if(f.max!=null)attrs.max=f.max;}
      attrs.value=value??(f.type==='color'?'#4f46e5':'');
      const inp=h('input',attrs);
      return {el:inp,get:()=>f.type==='number'?(inp.value===''?'':Number(inp.value)):inp.value.trim()};
    }
    case 'textarea':{
      const t=h('textarea',{rows:3,placeholder:f.placeholder,value:value??''});
      return {el:t,get:()=>t.value.trim()};
    }
    case 'select':{
      const s=h('select',{},h('option',{value:''},'انتخاب کنید…'),(f.options||[]).map(o=>h('option',{value:o,selected:o===value},o)));
      return {el:s,get:()=>s.value};
    }
    case 'radio':{
      const name=uid();let cur=value??'';
      const box=h('div',{},(f.options||[]).map(o=>h('label',{class:'opt'},h('input',{type:'radio',name,checked:o===value,onchange:()=>{cur=o;}}),o)));
      return {el:box,get:()=>cur};
    }
    case 'checkboxes':{
      const sel=new Set(Array.isArray(value)?value:[]);
      const box=h('div',{},(f.options||[]).map(o=>h('label',{class:'opt'},h('input',{type:'checkbox',checked:sel.has(o),onchange:e=>{e.target.checked?sel.add(o):sel.delete(o);}}),o)));
      return {el:box,get:()=>(f.options||[]).filter(o=>sel.has(o))};
    }
    case 'boolean':{
      const inp=h('input',{type:'checkbox',checked:!!value});
      const txt=h('span',{},inp.checked?'بله':'خیر');
      inp.addEventListener('change',()=>{txt.textContent=inp.checked?'بله':'خیر';});
      return {el:h('label',{class:'switch'},inp,h('span',{class:'slider'}),txt),get:()=>inp.checked};
    }
    case 'range':{
      const min=f.min??0,max=f.max??100,step=f.step||1;
      const out=h('output',{});
      const inp=h('input',{type:'range',min,max,step,value:value===''||value==null?min:value,oninput:()=>{out.textContent=fa(inp.value);}});
      out.textContent=fa(inp.value);
      return {el:h('div',{class:'rangebox'},inp,out),get:()=>Number(inp.value)};
    }
    case 'rating':{
      const max=f.max||5;let cur=+value||0;
      const wrap=h('div',{class:'stars'});
      const draw=()=>{wrap.innerHTML='';for(let i=1;i<=max;i++)wrap.append(h('button',{type:'button',class:'star'+(i<=cur?' on':''),'aria-label':fa(i),onclick:()=>{cur=cur===i?0:i;draw();}},'★'));};
      draw();
      return {el:wrap,get:()=>cur||''};
    }
    case 'jdate':{
      let cur=value||'';
      const inp=h('input',{type:'text',readOnly:true,placeholder:'انتخاب تاریخ شمسی…',onclick:open});
      const clr=h('button',{type:'button',class:'icon-btn','aria-label':'پاک کردن',onclick:()=>{cur='';show();}},'✕');
      const show=()=>{inp.value=cur?jdLong(cur):'';clr.style.visibility=cur?'visible':'hidden';};
      function open(){openJalaliPicker(cur,v=>{cur=v;show();});}
      show();
      return {el:h('div',{class:'jd-wrap'},inp,clr),get:()=>cur};
    }
    case 'subform':return buildSubform(f,value,depth);
  }
  return {el:h('div',{},'نوع فیلد ناشناخته'),get:()=>null};
}

function buildSubform(f,value,depth){
  const sub=getForm(f.subformId);
  const multi=!!f.multiple;
  if(!sub)return {el:h('div',{class:'note'},'فرم مرتبط پیدا نشد (ممکن است حذف شده باشد).'),get:()=>value??(multi?[]:null)};
  if(depth>5)return {el:h('div',{class:'note'},'عمق تو در تو بیش از حد مجاز است.'),get:()=>value??(multi?[]:null)};
  const BAD='مقادیر زیرفرم را بررسی کنید';
  /* inline */
  if(f.mode==='inline'){
    if(multi){
      const rows=[];const list=h('div',{class:'rows'});
      const renum=()=>rows.forEach((r,i)=>{r.title.textContent=`${sub.title} — ردیف ${fa(i+1)}`;});
      const addRow=data=>{
        const ui=buildFormUI(sub,data||{},depth+1);
        const title=h('b',{});
        const row={ui,title};
        const card=h('div',{class:'row-card'},h('div',{class:'row-head'},title,
          h('button',{type:'button',class:'btn danger',onclick:()=>{rows.splice(rows.indexOf(row),1);card.remove();renum();}},'حذف ردیف')),ui.el);
        rows.push(row);list.append(card);renum();
      };
      (Array.isArray(value)?value:[]).forEach(addRow);
      const el=h('div',{},list,h('button',{type:'button',class:'btn',onclick:()=>addRow()},'＋ افزودن ردیف'));
      return {el,get:()=>rows.map(r=>r.ui.get()),validate:()=>{
        if(f.required&&!rows.length)return 'حداقل یک ردیف لازم است';
        let ok=true;rows.forEach(r=>{if(!r.ui.validate())ok=false;});return ok?'':BAD;}};
    }
    const ui=buildFormUI(sub,value&&typeof value==='object'?value:{},depth+1);
    return {el:h('div',{class:'row-card'},ui.el),get:()=>ui.get(),validate:()=>ui.validate()?'':BAD};
  }
  /* dialog */
  let items=multi?(Array.isArray(value)?[...value]:[]):(value&&typeof value==='object'?[value]:[]);
  const box=h('div',{});
  function openEditor(i){
    const ui=buildFormUI(sub,i==null?{}:items[i],depth+1);
    openDialog(ui.el,{title:sub.title,footer:d=>[
      h('button',{type:'button',class:'btn primary',onclick:()=>{
        if(!ui.validate()){toast('لطفاً خطاها را برطرف کنید');return;}
        if(i==null)items.push(ui.get());else items[i]=ui.get();
        render();d.close();}},'تأیید'),
      h('button',{type:'button',class:'btn',onclick:()=>d.close()},'انصراف')]});
  }
  function render(){
    box.innerHTML='';
    if(items.length){
      box.append(h('div',{class:'chips'},items.map((it,i)=>h('div',{class:'chip'},
        h('span',{},summarize(sub,it)||`رکورد ${fa(i+1)}`),
        h('button',{type:'button',class:'icon-btn','aria-label':'ویرایش',onclick:()=>openEditor(i)},'✎'),
        h('button',{type:'button',class:'icon-btn','aria-label':'حذف',onclick:()=>{items.splice(i,1);render();}},'✕')))));
    }
    if(multi||!items.length)box.append(h('button',{type:'button',class:'btn',onclick:()=>openEditor(null)},multi?'＋ افزودن رکورد':'＋ ثبت اطلاعات'));
  }
  render();
  return {el:box,get:()=>multi?items:(items[0]??null),validate:()=>f.required&&!items.length?'ثبت اطلاعات الزامی است':''};
}

function decorate(){
  document.querySelectorAll('.btn:not([data-ic]),.fab:not([data-ic]),.icon-btn:not([data-ic]),.star:not([data-ic])').forEach(el=>{
    el.dataset.ic='1';
    let t=el.textContent.trim(),name=null;
    if(el.classList.contains('star')){el.textContent='';el.append(ic('star'));return;}
    if(ICON_ONLY.has(t)){el.textContent='';el.append(ic(ICON_OF[t]));return;}
    if(/^＋/.test(t))name='plus';else name=LABEL_ICONS[t];
    if(!name)return;
    const tn=[...el.childNodes].find(n=>n.nodeType===3&&n.nodeValue.trim());
    if(tn)tn.nodeValue=tn.nodeValue.replace(/^\s*＋\s*/,'');
    el.prepend(ic(name));
  });
}

/* ---- reports & charts ---- */
const COLORS=['#4f46e5','#16a34a','#f59e0b','#dc2626','#0891b2','#9333ea','#db2777','#65a30d','#ea580c','#475569'];
function aggregate(f,recs){
  const vals=recs.map(r=>r.data[f.id]);
  const m=new Map();const inc=k=>m.set(k,(m.get(k)||0)+1);const t=f.type;
  if(t==='checkboxes')vals.forEach(v=>(v||[]).forEach(inc));
  else if(t==='boolean')vals.forEach(v=>inc(v?'بله':'خیر'));
  else if(t==='jdate')vals.forEach(v=>{if(v)inc(String(v).slice(0,7).replace('-','/'));});
  else if(t==='number'||t==='range'){
    const nums=vals.filter(v=>typeof v==='number');
    if(!nums.length)return [];
    const mn=Math.min(...nums),mx=Math.max(...nums),distinct=new Set(nums).size;
    if(distinct<=8)nums.forEach(v=>inc(v));
    else{
      const w=(mx-mn)/6||1;const bins=Array.from({length:6},(_,i)=>({label:`${+(mn+i*w).toFixed(1)} تا ${+(mn+(i+1)*w).toFixed(1)}`,count:0}));
      nums.forEach(v=>{bins[Math.min(5,Math.floor((v-mn)/w))].count++;});return bins;
    }
  }else vals.forEach(v=>{if(!isEmpty(v))inc(String(v));});
  let rows=[...m].map(([label,count])=>({label:String(label),count}));
  if(t==='jdate'||t==='rating'||t==='number'||t==='range')rows.sort((a,b)=>a.label.localeCompare(b.label,undefined,{numeric:true}));
  else rows.sort((a,b)=>b.count-a.count);
  return rows;
}
function barChart(rows){
  const mx=Math.max(1,...rows.map(r=>r.count));
  return h('div',{class:'bars'},rows.map((r,i)=>h('div',{class:'bar-row'},
    h('span',{class:'bar-l'},fa(r.label)),
    h('div',{class:'bar-track'},(()=>{const b=h('div',{class:'bar-fill'});b.style.width=(r.count/mx*100)+'%';b.style.background=COLORS[i%COLORS.length];return b;})()),
    h('b',{class:'bar-n'},fa(r.count)))));
}
function pieChart(rows){
  const total=rows.reduce((s,r)=>s+r.count,0)||1;let a=-Math.PI/2;const cx=100,cy=100,R=90;let paths='';
  rows.forEach((r,i)=>{
    const ang=r.count/total*Math.PI*2,col=COLORS[i%COLORS.length];
    if(rows.length===1){paths+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${col}"/>`;return;}
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a+ang),y2=cy+R*Math.sin(a+ang);
    paths+=`<path d="M${cx} ${cy}L${x1.toFixed(2)} ${y1.toFixed(2)}A${R} ${R} 0 ${ang>Math.PI?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z" fill="${col}"/>`;a+=ang;
  });
  const svg=h('div',{class:'pie'});svg.innerHTML=`<svg viewBox="0 0 200 200" role="img" aria-label="نمودار دایره‌ای">${paths}<circle cx="100" cy="100" r="46" fill="var(--card)"/></svg>`;
  const legend=h('div',{class:'legend'},rows.map((r,i)=>{const s=h('span',{class:'swatch'});s.style.background=COLORS[i%COLORS.length];return h('div',{},s,' ',fa(r.label),' — ',h('b',{},fa(r.count)),h('span',{class:'muted sm'},` (${fa(Math.round(r.count/total*100))}٪)`));}));
  return h('div',{class:'pie-wrap'},svg,legend);
}
function tableChart(rows){return h('table',{class:'tbl'},h('tbody',{},rows.map(r=>h('tr',{},h('td',{},fa(r.label)),h('td',{},fa(r.count))))));}
function reportBody(rep){
  const f=getForm(rep.formId);const fld=f&&f.fields.find(x=>x.id===rep.fieldId);
  if(!f||!fld)return h('div',{class:'note'},'فرم یا فیلد این گزارش دیگر وجود ندارد.');
  const recs=recordsOf(f.id);const rows=aggregate(fld,recs);
  if(!rows.length)return h('div',{class:'empty sm'},'داده‌ای برای نمایش نیست.');
  const out=h('div',{},h('div',{class:'muted sm'},`${f.title} ← ${fld.label} · ${fa(recs.length)} رکورد`),
    rep.chart==='pie'?pieChart(rows):rep.chart==='table'?tableChart(rows):barChart(rows));
  if(['number','range'].includes(fld.type)){
    const nums=recs.map(r=>r.data[fld.id]).filter(v=>typeof v==='number');
    if(nums.length){const s=nums.reduce((a,b)=>a+b,0);out.append(h('div',{class:'stats'},
      [['جمع',s],['میانگین',+(s/nums.length).toFixed(2)],['کمترین',Math.min(...nums)],['بیشترین',Math.max(...nums)]].map(([l,v])=>h('span',{class:'badge'},`${l}: ${fa(v)}`))));}
  }
  return out;
}

    h('button',{class:'btn primary',onclick:()=>{

/* ---- messengers ---- */
const PLATFORMS={bale:{name:'بله',base:'https://tapi.bale.ai',how:'در بله با ربات «@botfather» یک ربات بسازید و توکن را اینجا وارد کنید. شناسهٔ چت را می‌توانید از پیام‌های دریافتی ربات (getUpdates) به‌دست آورید.'},
  telegram:{name:'تلگرام',base:'https://api.telegram.org',how:'در تلگرام با «@BotFather» ربات بسازید و توکن را وارد کنید. اگر دسترسی مستقیم به تلگرام محدود است، آدرس API را با یک واسط/پروکسی جایگزین کنید.'}};
async function botCall(p,method,body){
  const c=DB.get(p,{});if(!c.token)throw new Error('توکن ربات وارد نشده است');
  const base=(c.baseUrl||PLATFORMS[p].base).replace(/\/+$/,'');
  const res=await fetch(`${base}/bot${c.token}/${method}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});
  const j=await res.json().catch(()=>({}));
  if(!res.ok||j.ok===false)throw new Error(j.description||('خطای HTTP '+res.status));
  return j.result;
}
function sendMsg(p,text,chatId){
  const id=chatId||DB.get(p,{}).chatId;if(!id)return Promise.reject(new Error('شناسهٔ چت وارد نشده است'));
  return botCall(p,'sendMessage',{chat_id:id,text});
}
async function broadcast(text){
  const out=[];
  for(const p of Object.keys(PLATFORMS)){
    const c=DB.get(p,{});if(!c.enabled||!c.token)continue;
    try{await sendMsg(p,text);out.push(`${PLATFORMS[p].name}: ارسال شد`);}catch(e){out.push(`${PLATFORMS[p].name}: ${e.message}`);}
  }
  return out;
}
function notifyRecord(form,rec){
  const m=DB.get('messenger',{});if(!m.onRecord)return;
  const text=(m.template||'رکورد جدید در «{form}»\n{summary}').replace('{form}',form.title).replace('{summary}',summarize(form,rec.data).replace(/[⁦-⁩]/g,''));
  broadcast(text).catch(()=>{});
}

  VIRTUAL[schema.id]=schema;
  const ui=buildFormUI(schema,DB.get(p,{enabled:false}),0);
  const out=h('div',{class:'note',hidden:true});

  const run=(label,fn)=>async()=>{if(!saveCfg())return;say('در حال '+label+'…');try{say(await fn());}catch(e){say('خطا: '+e.message+' (در صورت خطای شبکه یا CORS از یک واسط سروری استفاده کنید)',true);}};
  page({title:'تنظیمات '+P.name},
    h('div',{class:'note',style:'margin-bottom:12px'},P.how),
    h('div',{class:'card'},ui.el),
    h('div',{class:'btn-row',style:'margin-bottom:12px'},
      h('button',{class:'btn primary',onclick:()=>{if(saveCfg())toast('ذخیره شد');}},'ذخیره'),
      h('button',{class:'btn',onclick:run('بررسی اتصال',async()=>{const r=await botCall(p,'getMe');return `اتصال برقرار است ✓ — ربات: ${r.first_name||''} (@${r.username||'?'})`;})},'بررسی اتصال'),

/* ---- backup & restore ---- */
const BACKUP_KEYS=['forms','records','users','roles','processes','reports','settings','messenger','bale','telegram'];
function exportBackup(withSecrets){
  const data={};
  BACKUP_KEYS.forEach(k=>{let v=DB.get(k,null);if(v==null)return;if(!withSecrets&&(k==='bale'||k==='telegram'))v={...v,token:''};data[k]=v;});
  const t=todayJ(),stamp=fmtJ(t.jy,t.jm,t.jd);
  download(`formbuilder-backup-${stamp}.json`,JSON.stringify({app:'formbuilder',version:APP_VERSION,date:Date.now(),data},null,1),'application/json');
  DB.set('meta',{...DB.get('meta',{}),lastBackup:stamp.replace(/-/g,'/')});
}
function importBackup(e){
  const file=e.target.files[0];e.target.value='';if(!file)return;
  file.text().then(t=>{
    const d=JSON.parse(t);
    const data=d.data||(Array.isArray(d.forms)?{forms:d.forms,records:d.records||{}}:null);
    if(!data||!Array.isArray(data.forms))throw 0;
    if(!confirm('اطلاعات فعلی با پشتیبان جایگزین شود؟'))return;
    BACKUP_KEYS.forEach(k=>{
      if(!(k in data))return;
      let v=data[k];
      if((k==='bale'||k==='telegram')&&v&&!v.token)v={...v,token:DB.get(k,{}).token||''};
      DB.set(k,v);
    });
    toast('بازیابی شد');applySettings();route();
  }).catch(()=>toast('فایل پشتیبان معتبر نیست'));
}

  const secrets=h('input',{type:'checkbox'});

    h('div',{class:'card'},h('h2',{},'پشتیبان‌گیری'),

/* ---- update & versioning ---- */
let swReg=null;
const INTERVALS={'خاموش':0,'هر ۱۵ دقیقه':15,'هر ساعت':60,'روزانه':1440};
const intervalMin=()=>{const l=DB.get('settings',{}).updateInterval||'هر ساعت';return INTERVALS[l]??60;};
const cmpVer=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d<0?-1:1;}return 0;};
const UPD={info:null,changelog:[],available:false,checking:false};
const setMeta=o=>DB.set('meta',{...DB.get('meta',{}),...o});

async function fetchRemoteVersion(){
  const r=await fetch(`version.js?t=${Date.now()}`,{cache:'no-store'});
  if(!r.ok)throw new Error('خطای HTTP '+r.status);
  const txt=await r.text();
  const v=txt.match(/APP_VERSION\s*=\s*'(\d+\.\d+\.\d+)'/);
  if(!v)throw new Error('فایل نسخه نامعتبر است');
  return {version:v[1],date:(txt.match(/APP_DATE\s*=\s*'([^']*)'/)||[])[1]||''};
}
async function fetchChangelog(){
  for(const u of [`changelog.json?t=${Date.now()}`,'changelog.json']){
    try{const r=await fetch(u,{cache:'no-store'});if(r.ok){const j=await r.json();if(Array.isArray(j))return j;}}catch{}
  }
  return [];
}
async function checkForUpdate({silent=false}={}){
  if(UPD.checking)return UPD.info;
  UPD.checking=true;
  try{
    const j=await fetchRemoteVersion();
    UPD.info=j;UPD.available=cmpVer(j.version,APP_VERSION)>0;
    UPD.changelog=await fetchChangelog();
    setMeta({lastCheck:Date.now()});
    markUpdateBadge();
    if(UPD.available&&DB.get('meta',{}).dismissed!==j.version)showUpdateBanner(j);
    if(!UPD.available)$('#upd-banner')?.remove();
    return j;
  }catch(e){if(!silent)throw e;return null;}
  finally{UPD.checking=false;}
}
function markUpdateBadge(){
  drawerEl&&drawerEl.querySelector('.dr-item[data-id=update]')?.classList.toggle('has-update',UPD.available);
  document.querySelector('.menu-btn')?.classList.toggle('has-update',UPD.available);
}
function showUpdateBanner(j){
  let b=$('#upd-banner');if(b)b.remove();
  b=h('div',{id:'upd-banner',role:'status'},
    h('span',{},`نسخهٔ ${fa(j.version)} آماده است`),
    h('button',{class:'btn primary',onclick:()=>openUpdateDialog(j)},'مشاهده'),
    h('button',{class:'icon-btn','aria-label':'بعداً',onclick:()=>{setMeta({dismissed:j.version});b.remove();}},'✕'));
  document.body.append(b);
}
function notesSince(){return (UPD.changelog||[]).filter(e=>cmpVer(e.version,APP_VERSION)>0);}
function changelogNode(entries){
  return h('div',{},entries.map(e=>h('div',{class:'cl'},h('b',{},'نسخهٔ '+fa(e.version)),' ',h('span',{class:'muted sm'},fa(e.date||'')),
    h('ul',{class:'steps'},(e.notes||[]).map(n=>h('li',{},n))))));
}
function openUpdateDialog(j){
  const entries=notesSince();
  openDialog(h('div',{},
    h('p',{},`نسخهٔ فعلی ${fa(APP_VERSION)} ← نسخهٔ جدید ${fa(j.version)}`),
    entries.length?changelogNode(entries):null,
    h('div',{class:'note sm'},'با بروزرسانی، برنامه یک‌بار بارگذاری مجدد می‌شود؛ اطلاعات ذخیره‌شده حفظ می‌شود اما فرمی که نیمه‌کاره پر کرده‌اید ذخیره نمی‌شود.')),
  {title:'نسخهٔ جدید برنامه',footer:d=>[
    h('button',{class:'btn primary',onclick:()=>{d.close();applyUpdate();}},'بروزرسانی اکنون'),
    h('button',{class:'btn',onclick:()=>{setMeta({dismissed:j.version});$('#upd-banner')?.remove();d.close();}},'بعداً')]});
}
function waitForWaiting(reg,ms){
  return new Promise(res=>{
    if(reg.waiting)return res(reg.waiting);
    const t=setTimeout(()=>res(null),ms);
    const watch=w=>{if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'){clearTimeout(t);res(reg.waiting||w);}});};
    watch(reg.installing);
    reg.addEventListener('updatefound',()=>watch(reg.installing));
  });
}
async function applyUpdate(){
  toast('در حال بروزرسانی…');
  try{
    if('serviceWorker' in navigator){
      const reg=swReg||await navigator.serviceWorker.getRegistration();
      if(reg){
        await reg.update();
        const w=await waitForWaiting(reg,15000);
        if(w){w.postMessage({type:'SKIP_WAITING'});return;}  // controllerchange صفحه را بارگذاری مجدد می‌کند
      }
    }
  }catch{}
  try{if('caches' in window)for(const k of await caches.keys())await caches.delete(k);}catch{}
  location.reload();
}
let updTimer=null;
function scheduleUpdateChecks(){
  clearInterval(updTimer);
  const min=intervalMin();if(!min)return;
  updTimer=setInterval(()=>{if(navigator.onLine)checkForUpdate({silent:true});},min*60000);
}
function checkIfDue(){
  const min=intervalMin();if(!min||!navigator.onLine)return;
  if(Date.now()-(DB.get('meta',{}).lastCheck||0)>=min*60000)checkForUpdate({silent:true});
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkIfDue();});

    if(UPD.info){

  }
  const check=async()=>{
    status.textContent='در حال بررسی…';
    try{await checkForUpdate();}catch(e){status.textContent='بررسی ناموفق بود: '+e.message+' (اتصال اینترنت را بررسی کنید)';return;}
    paint();
  };
  paint();
  page({title:'بروزرسانی'},
    h('div',{class:'card'},h('h2',{},'نسخهٔ فعلی'),h('p',{style:'font-size:22px;font-weight:700'},fa(APP_VERSION)),
      h('p',{class:'muted sm'},'بررسی خودکار: '+(DB.get('settings',{}).updateInterval||'هر ساعت')+' (قابل تغییر در تنظیمات برنامه)')),
    h('div',{class:'card'},status,last,h('div',{class:'btn-row'},h('button',{class:'btn primary',onclick:check},'بررسی بروزرسانی'),apply,inst)),
    h('div',{class:'card'},h('h2',{},'تاریخچهٔ تغییرات'),log),
    h('div',{class:'card'},h('h2',{},'رفع مشکل'),h('p',{class:'muted sm'},'پاک کردن حافظهٔ پنهان برنامه (داده‌های شما پاک نمی‌شود) و بارگذاری مجدد.'),
      h('div',{class:'btn-row'},h('button',{class:'btn',onclick:async()=>{if('caches' in window)for(const k of await caches.keys())await caches.delete(k);location.reload();}},'پاک کردن کش و بارگذاری مجدد'))));
  if(!UPD.info)checkForUpdate({silent:true}).then(paint);
}

/* builder */
function viewBuilder(id){
  const ex=id&&id!=='new'?getForm(id):null;
  if(id&&id!=='new'&&!ex)return notFound();
  const draft=ex?JSON.parse(JSON.stringify(ex)):{id:uid(),title:'',description:'',fields:[]};
  const listEl=h('div',{});
  const move=(i,d)=>{const j=i+d;[draft.fields[i],draft.fields[j]]=[draft.fields[j],draft.fields[i]];drawList();};
  function drawList(){
    listEl.innerHTML='';
    if(!draft.fields.length)listEl.append(h('div',{class:'empty sm'},'هنوز فیلدی اضافه نشده است.'));
    draft.fields.forEach((f,i)=>{
      const sub=f.type==='subform'?getForm(f.subformId):null;
      const info=TYPES[f.type].label+(f.required?' · اجباری':'')+(f.type==='subform'?` · «${sub?sub.title:'؟'}» · ${f.mode==='inline'?'درون‌خط':'دیالوگ'} · ${f.multiple?'چندرکوردی':'تک‌رکوردی'}`:'');
      listEl.append(h('div',{class:'fcard'},
        h('div',{class:'fmain'},h('b',{},f.label),h('div',{class:'muted sm'},info)),
        h('div',{class:'fbtns'},
          h('button',{class:'icon-btn',disabled:i===0,'aria-label':'بالا',onclick:()=>move(i,-1)},'↑'),
          h('button',{class:'icon-btn',disabled:i===draft.fields.length-1,'aria-label':'پایین',onclick:()=>move(i,1)},'↓'),
          h('button',{class:'icon-btn','aria-label':'ویرایش',onclick:()=>openFieldEditor(draft,f,nf=>{draft.fields[i]=nf;drawList();})},'✎'),
          h('button',{class:'icon-btn','aria-label':'حذف',onclick:()=>{if(confirm('این فیلد حذف شود؟')){draft.fields.splice(i,1);drawList();}}},'✕'))));
    });
  }
  function saveForm(){
    if(!draft.title.trim()){toast('عنوان فرم را وارد کنید');return;}
    if(!draft.fields.length){toast('حداقل یک فیلد اضافه کنید');return;}
    draft.title=draft.title.trim();
    const forms=Store.forms;const i=forms.findIndex(x=>x.id===draft.id);
    if(i>=0)forms[i]=draft;else forms.push(draft);
    Store.forms=forms;toast('فرم ذخیره شد');location.hash='#/forms';
  }
  drawList();
  page({title:ex?'ویرایش فرم':'فرم جدید',back:'#/forms',actions:[h('button',{class:'icon-btn','aria-label':'ذخیره',onclick:saveForm},'✓')]},
    h('div',{class:'card'},
      h('label',{class:'row'},h('span',{},'عنوان فرم'),h('input',{type:'text',value:draft.title,placeholder:'مثلاً: ثبت مشتری',oninput:e=>{draft.title=e.target.value;}})),
      h('label',{class:'row'},h('span',{},'توضیحات (اختیاری)'),h('input',{type:'text',value:draft.description||'',oninput:e=>{draft.description=e.target.value;}}))),
    h('h3',{},'فیلدها'),listEl,
    h('div',{class:'btn-row'},
      h('button',{class:'btn',onclick:()=>openFieldEditor(draft,null,nf=>{draft.fields.push(nf);drawList();})},'＋ افزودن فیلد'),
      h('button',{class:'btn primary',onclick:saveForm},'ذخیره فرم')));
}

function openFieldEditor(draft,field,onSave){
  const f=field?JSON.parse(JSON.stringify(field)):{id:uid(),label:'',type:'text',required:false,options:[]};
  const eligible=Store.forms.filter(g=>g.id!==draft.id&&!usesForm(g.id,draft.id));
  const cfg=h('div',{});
  const num=v=>v===''||v==null||isNaN(+v)?undefined:+v;
  const row=(label,ctl)=>h('label',{class:'row'},h('span',{},label),ctl);
  const numIn=(key,ph)=>h('input',{type:'number',step:'any',placeholder:ph,value:f[key]??'',oninput:e=>{f[key]=num(e.target.value);}});
  function drawCfg(){
    cfg.innerHTML='';const t=f.type;
    if(TYPES[t].opts)cfg.append(row('گزینه‌ها (هر گزینه در یک خط)',h('textarea',{rows:5,value:(f.options||[]).join('\n'),oninput:e=>{f.options=e.target.value.split('\n').map(s=>s.trim()).filter(Boolean);}})));
    if(['text','textarea','email','tel','url','number'].includes(t))cfg.append(row('متن راهنمای داخل فیلد',h('input',{type:'text',value:f.placeholder||'',oninput:e=>{f.placeholder=e.target.value;}})));
    if(t==='number')cfg.append(h('div',{class:'pair'},row('حداقل',numIn('min')),row('حداکثر',numIn('max'))));
    if(t==='range')cfg.append(h('div',{class:'pair'},row('حداقل',numIn('min','0')),row('حداکثر',numIn('max','100'))),row('گام',numIn('step','1')));
    if(t==='rating')cfg.append(row('تعداد ستاره',numIn('max','5')));
    if(t==='subform'){
      if(!eligible.length){cfg.append(h('div',{class:'note'},'برای استفاده از زیرفرم ابتدا یک فرم دیگر بسازید و ذخیره کنید.'));return;}
      if(!eligible.some(g=>g.id===f.subformId))f.subformId=eligible[0].id;
      f.mode=f.mode||'dialog';
      cfg.append(
        row('فرم مورد استفاده',h('select',{onchange:e=>{f.subformId=e.target.value;}},eligible.map(g=>h('option',{value:g.id,selected:g.id===f.subformId},g.title)))),
        row('نحوهٔ نمایش',h('select',{onchange:e=>{f.mode=e.target.value;}},
          h('option',{value:'dialog',selected:f.mode==='dialog'},'پنجرهٔ دیالوگی'),
          h('option',{value:'inline',selected:f.mode==='inline'},'درون‌خط (داخل همین فرم)'))),
        h('label',{class:'chk'},h('input',{type:'checkbox',checked:!!f.multiple,onchange:e=>{f.multiple=e.target.checked;}}),'امکان ثبت چند رکورد'));
    }
  }
  const body=h('div',{},
    row('عنوان فیلد',h('input',{type:'text',value:f.label,oninput:e=>{f.label=e.target.value;}})),
    row('نوع فیلد',h('select',{onchange:e=>{f.type=e.target.value;drawCfg();}},Object.entries(TYPES).map(([k,v])=>h('option',{value:k,selected:k===f.type},v.label)))),
    cfg,
    row('توضیح زیر عنوان (اختیاری)',h('input',{type:'text',value:f.help||'',oninput:e=>{f.help=e.target.value;}})),
    h('label',{class:'chk'},h('input',{type:'checkbox',checked:!!f.required,onchange:e=>{f.required=e.target.checked;}}),'فیلد اجباری باشد'));
  drawCfg();
  openDialog(body,{title:field?'ویرایش فیلد':'فیلد جدید',footer:d=>[
    h('button',{class:'btn primary',onclick:()=>{
      if(!f.label.trim())return toast('عنوان فیلد را وارد کنید');
      if(TYPES[f.type].opts&&!(f.options||[]).length)return toast('حداقل یک گزینه وارد کنید');
      if(f.type==='subform'&&!f.subformId)return toast('یک فرم برای زیرفرم انتخاب کنید');
      f.label=f.label.trim();
      if(f.type!=='subform'){delete f.subformId;delete f.mode;delete f.multiple;}
      onSave(f);d.close();}},'ذخیره'),
    h('button',{class:'btn',onclick:()=>d.close()},'انصراف')]});
}

/* fill */
function viewFill(fid,rid){
  const f=getForm(fid);if(!f)return notFound();
  const rec=rid?recordsOf(fid).find(r=>r.id===rid):null;
  if(rid&&!rec)return notFound();
  const ui=buildFormUI(f,rec?rec.data:{},0);
  const submit=again=>{
    if(!ui.validate()){toast('لطفاً خطاهای فرم را برطرف کنید');return;}
    const arr=recordsOf(fid);
    if(rec){const i=arr.findIndex(r=>r.id===rid);arr[i]={...rec,data:ui.get(),updatedAt:Date.now()};}
    else{const nr={id:uid(),createdAt:Date.now(),data:ui.get()};arr.push(nr);setTimeout(()=>notifyRecord(f,nr),0);}
    setRecords(fid,arr);toast('ذخیره شد');
    if(again)route();else location.hash=`#/records/${fid}`;
  };
  page({title:f.title,back:rec?`#/records/${fid}`:'#/forms'},
    f.description?h('p',{class:'muted'},f.description):null,
    h('div',{class:'card'},ui.el),
    h('div',{class:'btn-row'},
      h('button',{class:'btn primary',onclick:()=>submit(false)},rec?'ذخیرهٔ تغییرات':'ذخیره'),
      rec?null:h('button',{class:'btn',onclick:()=>submit(true)},'ذخیره و ثبت جدید')));
}

/* records */
const fmtDT=ts=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{dateStyle:'medium',timeStyle:'short'}).format(new Date(ts));}catch{return new Date(ts).toLocaleString();}};
const csvCell=s=>{s=String(s??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
function viewRecords(fid){
  const f=getForm(fid);if(!f)return notFound();
  const recs=recordsOf(fid);
  const exportCsv=()=>{
    const head=[...f.fields.map(x=>x.label),'تاریخ ثبت'];
    const rows=recs.map(r=>[...f.fields.map(x=>plain(x,r.data[x.id])),fmtDT(r.createdAt)]);
    download(`${f.title}.csv`,'\ufeff'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
  };
  const exportJson=()=>download(`${f.title}.json`,JSON.stringify({form:f,records:recs},null,1),'application/json');
  const list=recs.length?recs.map((r,i)=>h('details',{class:'card rec'},
    h('summary',{},h('span',{class:'rec-n'},fa(i+1)),h('span',{class:'rec-sum'},summarize(f,r.data)||'(خالی)'),h('span',{class:'muted sm'},fmtDT(r.createdAt))),
    renderReadonly(f,r.data,0),
    h('div',{class:'btn-row'},
      h('a',{class:'btn',href:`#/fill/${fid}/${r.id}`},'ویرایش'),
      h('button',{class:'btn danger',onclick:()=>{if(confirm('این رکورد حذف شود؟')){setRecords(fid,recordsOf(fid).filter(x=>x.id!==r.id));viewRecords(fid);}}},'حذف'))))
    :h('div',{class:'empty'},'هنوز رکوردی ثبت نشده است.');
  page({title:`رکوردهای ${f.title}`,back:'#/forms'},
    h('div',{class:'btn-row',style:'margin:0 0 12px'},
      h('a',{class:'btn primary',href:`#/fill/${fid}`},'＋ رکورد جدید'),
      recs.length?h('button',{class:'btn',onclick:exportCsv},'خروجی CSV'):null,
      recs.length?h('button',{class:'btn',onclick:exportJson},'خروجی JSON'):null),
    list);
}

/* router */
function route(){
  seed();
  const [,a,b]=(location.hash||'#/').split('/');
  const c=(location.hash||'#/').split('/')[3];
  closeDrawer();
  markActive(({'':'home',builder:'forms',fill:'forms',records:'forms'})[a]??a);
  try{
    switch(a){
      case 'forms':viewForms();break;
      case 'builder':viewBuilder(b);break;
      case 'fill':viewFill(b,c);break;
      case 'records':viewRecords(b);break;
      case 'reports':viewReports();break;
      case 'users':viewUsers(b);break;
      case 'process':viewProcess();break;
      case 'messenger':viewMessenger();break;
      case 'bale':viewPlatform('bale');break;
      case 'telegram':viewPlatform('telegram');break;
      case 'backup':viewBackup();break;
      case 'update':viewUpdate();break;
      case 'settings':viewSettings();break;
      case 'about':viewAbout();break;
      default:viewHome();
    }
  }catch(e){console.error(e);page({title:'خطا',back:'#/'},h('div',{class:'empty'},'خطایی رخ داد: '+e.message));}
}
window.addEventListener('hashchange',route);
loadLucide();buildDrawer();applySettings();route();scheduleUpdateChecks();setTimeout(checkIfDue,3000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const had=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloading){reloading=true;location.reload();}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    swReg=r;
    r.addEventListener('updatefound',()=>{checkForUpdate({silent:true});});
  }).catch(()=>{});
}
</script>
